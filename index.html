<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- RSO_VERSION ver.20261106.01 -->
<title>RSO（登録支援機関システム）</title>
<style>
/* 営業管理システム（営シス）と同じ見た目：左に紺のサイドバー、右に白いカード。ライトのみ */
:root{
  --text:#1a202c; --muted:#718096; --line:#e2e8f0; --line2:#edf2f7;
  --bg:#f5f7fa; --card:#ffffff; --accent:#1a365d; --accent-dk:#0f2349;
  --side:#0f2040; --side-text:#94a3b8; --side-group:#64748b;
  --ok:#38a169; --mid:#dd6b20; --low:#e53e3e;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:var(--text);font-size:14px;line-height:1.6}
button,input,select,textarea{font-family:inherit;color:var(--text)}
.num{font-variant-numeric:tabular-nums}

/* サイドバー */
.sidebar{position:fixed;left:0;top:0;bottom:0;width:220px;background:var(--side);color:#fff;padding:env(safe-area-inset-top,0px) 0 20px env(safe-area-inset-left,0px);overflow-y:auto;z-index:30}
.sb-logo{padding:20px 18px 14px;font-size:15px;font-weight:700;color:#fff}
.sb-group{padding:12px 18px 4px;font-size:10px;color:var(--side-group);font-weight:700;letter-spacing:1px}
[hidden]{display:none!important}   /* ver.20261026.5: 運営以外に「登録支援機関の管理」が見えていたのを修正（display:flex が hidden を上書きしていた） */
.nav-item{display:flex;align-items:center;gap:9px;width:calc(100% - 16px);text-align:left;margin:1px 8px;padding:9px 14px;color:var(--side-text);font-size:13px;cursor:pointer;border:none;background:transparent;border-radius:6px}
.nav-item:hover{background:rgba(255,255,255,.10);color:#fff}
.nav-item.on{background:rgba(255,255,255,.14);color:#fff;font-weight:700}
.nav-item .badge{margin-left:auto;font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px;background:rgba(239,68,68,.18);color:#f87171}
.nav-item:focus-visible,.btn:focus-visible,.kpi:focus-visible{outline:2px solid #63b3ed;outline-offset:2px}

/* 本体 */
.main{padding-left:max(236px,calc(220px + 16px + env(safe-area-inset-left,0px)));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 60px}
.page-header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px;flex-wrap:wrap;gap:12px}
.page-title{margin:0 0 2px;font-size:22px;color:var(--accent);font-weight:700}
.page-subtitle{color:var(--muted);font-size:12px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sidebar,.main{transition:transform .2s ease,padding-left .2s ease}
.sb-toggle{position:fixed;top:12px;left:calc(220px - 44px + env(safe-area-inset-left,0px));z-index:40;width:34px;height:34px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;font-size:17px;line-height:1;cursor:pointer;transition:left .2s ease}
.sb-toggle:hover{background:rgba(255,255,255,.12)}
body.sb-closed .sb-toggle{border-color:var(--line);background:#fff;color:var(--side);box-shadow:0 2px 6px rgba(0,0,0,.08)}
body.sb-closed .sb-toggle:hover{background:#f7fafc}
body.sb-closed .sidebar{transform:translateX(-100%)}
.sb-olink{margin:4px 10px 10px;padding:8px 0 10px;border-bottom:1px solid rgba(255,255,255,.14)}
.sb-olink[hidden]{display:none!important}
.sb-olink-t{font-size:10px;letter-spacing:.08em;color:#9fb3c8;margin:0 2px 6px}
.nav-item.nav-olink{width:100%;margin:0;display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;padding:9px 10px;border-radius:9px;background:linear-gradient(135deg,#2b6cb0,#2c5282);color:#fff;font-weight:700;border:1px solid rgba(255,255,255,.18)}
.nav-item.nav-olink:hover{background:linear-gradient(135deg,#3182ce,#2b6cb0)}
.nav-item.nav-olink.on{background:#fff;color:#1a365d;box-shadow:0 0 0 2px #90cdf4}
.nav-olink .ol-mark{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.2);font-size:11px}
.nav-olink.on .ol-mark{background:#ebf8ff;color:#2b6cb0}
.nav-olink .ol-sub{flex-basis:100%;padding-left:28px;font-size:10.5px;font-weight:400;opacity:.85}
body.sb-closed .main{padding-left:max(56px,calc(16px + 40px + env(safe-area-inset-left,0px)))}
body.sb-closed .sb-toggle{left:calc(10px + env(safe-area-inset-left,0px))}
@media print{.sb-toggle{display:none}}
/* O-Link：画面いっぱいに表示（RSOの見出しは隠す。RSOの☰は左下へ） */
body.view-olink .page-header,body.view-olink #v-olink>.hint{display:none}
body.view-olink .main{padding:0}
body.view-olink #olinkFrame{position:fixed;top:0;left:0;width:100vw!important;height:100vh!important;height:100dvh!important;min-height:0!important;border:0!important;border-radius:0!important;z-index:20;transition:left .2s ease,width .2s ease}
body.view-olink:not(.sb-closed) #olinkFrame{left:220px;width:calc(100vw - 220px)!important}
.sb-rail{display:none}
body.view-olink.sb-closed .sb-rail{display:flex;position:fixed;top:0;left:0;bottom:0;width:38px;z-index:45;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:0;border:0;border-right:1px solid rgba(255,255,255,.15);background:var(--side);color:#fff;cursor:pointer;font:inherit}
body.view-olink.sb-closed .sb-rail:hover{background:#2c5282}
.sb-rail-i{font-size:16px}.sb-rail-t{writing-mode:vertical-rl;letter-spacing:.2em;font-size:12px;font-weight:700}.sb-rail-a{font-size:18px;opacity:.8}
body.view-olink.sb-closed .sb-toggle{display:none}
body.view-olink.sb-closed #olinkFrame{left:38px;width:calc(100vw - 38px)!important}
body.view-olink #v-olink>.empty,body.view-olink #v-olink>.msg{margin:60px 24px}
@media (max-width:820px){
  .sb-toggle{top:10px;left:auto;right:max(10px,env(safe-area-inset-right,0px))}
  body.sb-closed .sb-toggle{left:auto}
  body.sb-closed .sidebar{display:none;transform:none}
  .sb-olink{width:100%;margin:2px 0 6px;padding:0 0 6px}
  .sb-olink-t{display:none}
  .nav-item.nav-olink .ol-sub{display:none}
  body.sb-closed .main{padding-left:max(16px,env(safe-area-inset-left,0px))}
  body.view-olink:not(.sb-closed) #olinkFrame{left:0;width:100vw!important}
  body.view-olink:not(.sb-closed) .sidebar{position:fixed;top:0;left:0;right:0;z-index:50;max-height:75vh;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.3)}
  body.view-olink:not(.sb-closed) .sb-toggle{z-index:55}
  .sidebar{position:static;width:auto;padding:env(safe-area-inset-top,0px) max(8px,env(safe-area-inset-right,0px)) 8px max(8px,env(safe-area-inset-left,0px));display:flex;flex-wrap:wrap;align-items:center;gap:2px}
  .sb-logo{width:100%;padding:12px 10px 6px}
  .sb-group{display:none}
  .nav-item{width:auto;margin:0;padding:7px 11px}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-block:18px 48px}
}

.btn{padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--line2)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:var(--accent-dk)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-danger{color:#c53030}
.btn:disabled{opacity:.5;cursor:default}

/* ステータスのカード（営シスと同じ） */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:#fff;border:0;border-radius:10px;padding:12px 14px;box-shadow:0 2px 6px rgba(0,0,0,.04);border-left:4px solid #cbd5e0;cursor:pointer;text-align:left}
.kpi:hover{background:#f7fafc}
.kpi.on{outline:2px solid var(--accent)}
.kpi .k{font-size:11px;color:var(--muted)}
.kpi .v{font-size:20px;font-weight:700;line-height:1.2}

/* 期日アラート（案シスの期限アラートと同じ配色） */
.alertbar{display:flex;align-items:center;gap:10px;background:#fff5f5;border:1px solid #feb2b2;border-radius:10px;padding:11px 15px;margin-bottom:14px;cursor:pointer;width:100%;text-align:left}
.alertbar.active{background:#fed7d7;border-color:#fc8181}
.alertbar .ttl{font-size:13px;font-weight:800;color:#9b2c2c}
.alertbar .cnt{background:#dc2626;color:#fff;border-radius:9px;padding:1px 9px;font-size:12px;font-weight:800}
.alertbar .hint{font-size:11px;color:#c05621;margin-left:auto}

.filters{background:#fff;border-radius:10px;padding:14px 16px;margin-bottom:14px;box-shadow:0 2px 6px rgba(0,0,0,.04);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filters input[type=text],.filters select{padding:7px 10px;border:1px solid var(--line);border-radius:7px;font-size:13px;background:#fff}
.filters input[type=text]{min-width:0;width:260px;max-width:100%}

/* 表 */
.tablewrap{background:#fff;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.04);overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{background:#f7fafc;color:var(--muted);font-weight:600;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:#f7fafc}
tr.row-over{background:#fff5f5} tr.row-soon{background:#fffaf0}
tr.row-over:hover,tr.row-soon:hover{background:#fde8e8}
td.r,th.r{text-align:right}
.nm{font-weight:600}
.sub{color:var(--muted);font-size:11px}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
.b-未接触{background:#edf2f7;color:#4a5568}
.b-接触済み{background:#ebf8ff;color:#2b6cb0}
.b-アポ獲得{background:#e6fffa;color:#285e61}
.b-ヒアリング済み{background:#faf5ff;color:#6b46c1}
.b-提案中{background:#fffaf0;color:#c05621}
.b-受注{background:#f0fff4;color:#276749}
.b-失注{background:#fff5f5;color:#c53030}
.b-保留{background:#f7fafc;color:#a0aec0}
.kpi.s-未接触{border-left-color:#a0aec0}.kpi.s-接触済み{border-left-color:#3182ce}.kpi.s-アポ獲得{border-left-color:#319795}.kpi.s-ヒアリング済み{border-left-color:#805ad5}.kpi.s-提案中{border-left-color:#dd6b20}.kpi.s-受注{border-left-color:#38a169}.kpi.s-失注{border-left-color:#e53e3e}.kpi.s-保留{border-left-color:#cbd5e0}.kpi.s-open{border-left-color:var(--accent)}
.rank{font-weight:700}
.na-kind{display:inline-block;font-size:10px;color:#4a5568;background:#edf2f7;border-radius:4px;padding:1px 5px;margin-right:4px}
.nabadge{display:inline-block;padding:1px 7px;border-radius:999px;font-size:10px;font-weight:800;margin-left:4px}
.na-over{background:#dc2626;color:#fff} .na-soon{background:#f6ad55;color:#7b341e}
.empty{padding:40px;text-align:center;color:var(--muted)}

/* KPI画面 */
.subtabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.subtabs select{padding:6px 12px;border:1px solid var(--line);border-radius:999px;font-size:13px;font-weight:600;background:#fff;color:var(--text)}
.kcard{background:#fff;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.04);padding:16px 18px;margin-bottom:14px;min-width:0}
.kcard h3{margin:0 0 12px;font-size:14px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.goals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:14px}
@media (max-width:900px){.goals{grid-template-columns:1fr}}
.goals .kcard{margin-bottom:0}
.goalbig{text-align:center;padding:8px 0 4px}
.goalbig .num{font-size:44px;font-weight:800;line-height:1}
.goalbig .num small{font-size:20px;color:var(--muted);font-weight:700}
.goalbig .lab{font-size:13px;color:var(--muted);margin-top:6px}
.goalbig .sub{margin-top:4px}
.prow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f0f2f5}
.prow:last-child{border-bottom:none}
.prow .pname{flex:0 0 150px;font-size:13px;font-weight:600}
.prow .pname .sub{display:block;font-weight:400}
.prow .pbarwrap{flex:1;height:16px;background:var(--line2);border-radius:999px;overflow:hidden;position:relative;min-width:60px}
.prow .pbar{height:100%;border-radius:999px}
.prow .pace{position:absolute;top:0;bottom:0;width:2px;background:var(--text);opacity:.45}
.prow .pnum{flex:0 0 110px;text-align:right;font-size:13px}
.prow .pnum input{width:70px;padding:3px 6px;border:1px solid var(--line);border-radius:6px;text-align:right}
@media (max-width:600px){.prow .pname{flex-basis:92px}.prow .pnum{flex-basis:90px}}
.bar-ok{background:var(--ok)}.bar-mid{background:var(--mid)}.bar-low{background:var(--low)}.bar-none{background:#a0aec0}
.legend{font-size:11px;color:var(--muted);font-weight:400;display:flex;gap:12px;align-items:center}
.legend i{display:inline-block;width:2px;height:11px;background:var(--text);opacity:.45;margin-right:4px;vertical-align:-1px}
.two{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px}
@media (max-width:1000px){.two{grid-template-columns:1fr}}
.two .kcard{margin-bottom:14px}
.funnel{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end;gap:8px}
.fstep{display:flex;flex-direction:column;gap:4px;align-items:stretch;text-align:center}
.fstep .n{font-size:20px;font-weight:800}
.fstep .col{background:#bee3f8;border-radius:6px 6px 0 0;min-height:4px}
.fstep .l{font-size:12px;color:var(--muted);font-weight:600}
.frates{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:6px;padding-top:6px;border-top:1px solid var(--line);text-align:center;font-size:12px;color:var(--muted)}
.frates b{color:var(--text)}

/* ドロワー（営シスと同じ） */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50}
.drawer{position:fixed;top:0;right:0;bottom:0;width:60vw;min-width:min(560px,100vw);max-width:100%;background:#fff;z-index:51;overflow-y:auto;box-shadow:-4px 0 20px rgba(0,0,0,.12);padding-bottom:env(safe-area-inset-bottom,0px)}
.dhead{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:calc(16px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) 14px 20px;z-index:2;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dtitle{font-size:17px;font-weight:700;margin:0 0 3px}
.dbody{padding:4px max(20px,env(safe-area-inset-right,0px)) 30px 20px}
.dfoot{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px max(20px,env(safe-area-inset-right,0px)) 10px 20px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.sec-title{font-size:16px;font-weight:700;color:var(--accent);margin:16px 0 8px;padding-bottom:5px;border-bottom:2px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec-title .sub{font-weight:600}
.form{display:grid;grid-template-columns:110px minmax(0,1fr) 110px minmax(0,1fr);gap:8px 14px;align-items:center;font-size:13px}
.form > label{color:var(--muted);font-size:12px}
.form .span3{grid-column:2 / -1}
.form input,.form select,.form textarea{width:100%;padding:6px 9px;border:1px solid var(--line);border-radius:7px;font-size:13px;background:#fff;min-width:0}
.form textarea{min-height:64px;resize:vertical}
@media (max-width:640px){.form{grid-template-columns:96px minmax(0,1fr)}.form .span3{grid-column:2}}
.hint{font-size:11px;color:var(--muted);margin:6px 0 0}
.sugg{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.sugg li{display:flex;gap:8px;align-items:baseline;font-size:13px}
.t-bad{background:#fff5f5;color:#c53030;border:1px solid #feb2b2}
.t-warn{background:#fffaf0;color:#c05621;border:1px solid #fbd38d}
.t-ok{background:#ebf8ff;color:#2b6cb0;border:1px solid #bee3f8}
.tag{display:inline-block;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:700;white-space:nowrap}
details.hg{border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:#fff}
details.hg summary{cursor:pointer;padding:9px 12px;font-weight:700;font-size:13px;display:flex;justify-content:space-between;gap:8px;list-style:none}
details.hg summary::-webkit-details-marker{display:none}
details.hg summary::after{content:"▾";color:var(--muted)}
details.hg[open] summary{border-bottom:1px solid var(--line2)}
details.hg .body{padding:10px 12px}
details.hg .form{grid-template-columns:200px minmax(0,1fr)}
@media (max-width:640px){details.hg .form{grid-template-columns:1fr}}
.why{font-size:11px;color:#a0aec0;display:block;font-weight:400}
.note{border-left:3px solid #cbd5e0;background:#f7fafc;border-radius:0 8px 8px 0;padding:9px 12px;margin-bottom:8px}
.note .meta{font-size:11px;color:var(--muted);margin-bottom:3px}
.note .body{font-size:13px;white-space:pre-wrap}
.msg{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:12px;background:#fffaf0;color:#c05621;border:1px solid #fbd38d}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:#2d3748;color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;z-index:60}

/* ヒアリング項目 */
.hcols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:1000px){.hcols{grid-template-columns:1fr}}
.hcols .kcard{margin-bottom:0}
.hcols ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:7px;font-size:13px}
.hcols .why{font-size:12px;color:var(--muted)}
.mp-grid .mp-empty,.mp-grid td .mp-empty{background:#fffbeb;border-color:#f6ad55}
.mk{display:inline-block;margin-left:6px;padding:0 6px;border-radius:9px;font-size:10.5px;font-weight:700;vertical-align:1px}
.mk.e{background:#fffaf0;color:#b7791f;border:1px solid #f6ad55}.mk.o{background:#f0fff4;color:#2f855a;border:1px solid #9ae6b4}
.xm-body .x-empty,.xs-body .x-empty{background:#fffbeb!important;border-color:#f6ad55!important}.xs-body .wlist.x-empty,.xs-body .ms.x-empty{border:1px solid #f6ad55;border-radius:7px;padding:4px}.xm-body .ms.x-empty{border:1px solid #f6ad55;border-radius:7px;padding:4px}
.lk{color:#2b6cb0;text-decoration:none;font-weight:600}.lk:hover{text-decoration:underline}
.xsc{font-size:11.5px;font-weight:700;margin-left:8px}.xsc.e{color:#b7791f}.xsc.o{color:#2f855a}
.xsum{font-size:13px;margin:0 0 10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.xsum .bar{flex:0 0 140px;height:8px;border-radius:4px;background:#edf2f7;overflow:hidden}.xsum .bar i{display:block;height:100%;background:#48bb78}
.mp-grid .mpc{font-size:11.5px;font-weight:700;margin-left:6px}.mp-grid .mpc.e{color:#b7791f}.mp-grid .mpc.o{color:#2f855a}
#mpSum{margin:0 0 10px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}#mpSum .bar{flex:0 0 160px;height:8px;border-radius:4px;background:#edf2f7;overflow:hidden}#mpSum .bar i{display:block;height:100%;background:#48bb78}
.hcols.hedit{grid-template-columns:1fr;max-width:900px}
.hedit .hgh{display:flex;gap:6px;align-items:center;margin-bottom:10px}
.hedit input,.hedit select{padding:6px 9px;border:1px solid var(--line);border-radius:7px;font-size:13px;background:#fff;min-width:0;font-family:inherit}
.hedit input:focus,.hedit select:focus{outline:2px solid #bee3f8;border-color:#63b3ed}
.hedit .hgh input{flex:1;font-size:15px;font-weight:700}
.hedit .hit{border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:8px;background:#fafbfd}

function lastAct(id){var best=null;acts.forEach(function(a){if(a.leadId===id&&a.result!=='不通'&&(!best||a.date>best.date))best=a;});return best;}
function isOpen(l){return l.stage!=='受注'&&l.stage!=='失注'&&l.stage!=='保留';}

function badge(s){return '<span class="badge b-'+esc(s)+'">'+esc(s)+'</span>';}
function hFilled(l){var h=l.hearing||{},n=0;HEARING.forEach(function(g){g.items.forEach(function(it){if(h[it.id])n++;});});return n;}
function nextCell(l){
  if(!l.nextDate)return isOpen(l)?'<span class="sub">未設定</span>':'';

}

function monthActs(m,staff){return acts.filter(function(a){return a.date&&a.date.slice(0,7)===m&&(!staff||a.staff===staff);});}
function calc(m,staff){
  var r={calls:0,contacts:0,appts:0,hearings:0,proposals:0,wins:0,people:0,fee:0};
  monthActs(m,staff).forEach(function(a){
    if(a.kind==='架電')r.calls++;
    if(a.result&&a.result!=='不通')r.contacts++;
    if(a.result==='アポ獲得')r.appts++;
    if(a.result==='ヒアリング実施')r.hearings++;
    if(a.result==='提案')r.proposals++;
    if(a.result==='受注'){r.wins++;r.people+=Number(a.people||0);r.fee+=Number(a.people||0)*Number(a.fee||0);}
  });
  return r;
}
function tgt(k){var t=targets[kMonth]||targets['default']||{};var v=t[k];if(v==null){for(var i=0;i<KPIS.length;i++)if(KPIS[i].k===k)return KPIS[i].def;}return Number(v);}
function pace(m){var now=new Date(),cur=ym(now);var y=Number(m.slice(0,4)),mo=Number(m.slice(5,7));var days=new Date(y,mo,0).getDate();if(m<cur)return 1;if(m>cur)return 0;return now.getDate()/days;}
function barCls(v,t,p){if(!t||p===0)return 'bar-none';var r=v/(t*p);return r>=1?'bar-ok':(r>=0.7?'bar-mid':'bar-low');}
function colorOf(v,t,p){var c=barCls(v,t,p);return c==='bar-ok'?'var(--ok)':c==='bar-mid'?'var(--mid)':c==='bar-low'?'var(--low)':'var(--text)';}

/* ---------- 次の一手の候補 ---------- */
function suggestions(L){
  var h=L.hearing||{}, out=[], t=today(), filled=hFilled(L);
  if(isOpen(L)){if(!L.nextDate)out.push(['bad','次の一手の期日が決まっていません']);else if(L.nextDate<t)out.push(['bad','期日（'+md(L.nextDate)+'）を過ぎています']);}
  if(filled===0)out.push(['warn','ヒアリング前：人手不足の状況と外国人雇用の経験から聞く']);
  if(h.h_when==='3か月以内')out.push(['warn','急ぎの採用：国内在住の候補者と、受入れまでの期間を先に示す']);
  if(h.h_exp==='なし')out.push(['ok','初めての受入れ：制度の流れ・費用の総額・期間を1枚で説明する']);
  if(h.h_sup==='他社に委託'){out.push(['ok','乗り換えの提案：今の委託費との比較と、困りごとへの対応を用意する']);if(h.h_renew)out.push(['ok','委託契約の更新時期（'+h.h_renew+'）の2か月前にもう一度連絡する']);}
  if(h.h_sup==='自社支援')out.push(['ok','自社支援の負担（定期面談・届出・記録簿）を聞き、一部だけの委託も提案する']);
  if(h.h_kyo==='未加入')out.push(['warn','分野別協議会に未加入：加入の手順を案内する']);
  if(h.h_sha==='一部未加入'||h.h_ihan==='あり')out.push(['bad','受入れの要件に不安がある：受入れ可能か行政書士に事前に確認する']);
  if(h.h_pay==='難しい')out.push(['bad','報酬は日本人と同等以上が要件：給与水準を一緒に確認する']);
  if(h.h_house==='未定')out.push(['ok','住居が未定：住居探しの支援メニューを示す']);
  if(h.h_emp==='派遣'&&h.h_field!=='農業'&&h.h_field!=='漁業'&&L.field!=='農業'&&L.field!=='漁業')out.push(['bad','派遣で受け入れられるのは農業・漁業だけ：直接雇用にできるか確認する']);
  if(h.h_ins==='国保')out.push(['warn','国保の場合：法人なら社会保険の加入が必要。個人事業所かどうかを確認する']);
  if(h.h_move)out.push(['ok','技能実習からの移行予定あり：対象者の在留期限の一覧をもらう']);
  if(h.h_cmp)out.push(['ok','比較先（'+h.h_cmp+'）との違いを1枚にまとめて持っていく']);
  if(filled>0&&!h.h_dec)out.push(['warn','決裁者がまだ分からない：次回は決裁者の同席をお願いする']);
  return {list:out,filled:filled};
}

   テキストを Edge Function「ai-import」に送り、AIが読み取った会社を確認画面に並べる。
   登録はこの画面で選んだ行だけ（AIは読み取るだけで、DBには書かない） */

var aiCommon={staff:'',source:'テレアポ',rank:'C',stage:'未接触',nextDate:'',nextKind:'電話'};
function normName(s){return String(s||'').normalize('NFKC').replace(/株式会社|有限会社|合同会社|一般社団法人|社会福祉法人|医療法人|協同組合|\(株\)|\(有\)|（株）|（有）|\s/g,'').toLowerCase();}
function telDigits(s){var d=String(s||'').replace(/[^0-9]/g,'');return d.length>=10?d.slice(0,11):'';}
function markDups(){
  var names={}, tels={};
  leads.forEach(function(l){var n=normName(l.name);if(n)names[n]=l.name;var t=telDigits(l.tel);if(t)tels[t]=l.name;});
  var seen={};
  aiRows.forEach(function(r){
    var n=normName(r.name), t=telDigits(r.tel); r.dup='';
    if(n&&names[n])r.dup='登録済み：'+names[n]; else if(t&&tels[t])r.dup='電話が同じ：'+tels[t]; else if(n&&seen[n])r.dup='この中で重複';
    if(n)seen[n]=1;
  });
}

async function aiErrorText(err){

async function runAi(){
  aiText=$('ai_text').value; if(!aiText.trim()){toast('テキストを貼り付けてください');return;}
  aiBusy=true; aiErr=''; renderAi();
  try{
    var r=await db.functions.invoke('ai-import',{body:{text:aiText}});
    if(r.error)throw r.error;
    var d=r.data||{}; if(!d.ok)throw new Error(d.message||'読み取りに失敗しました');
    aiNote=(d.note||'')+(d.truncated?'（量が多く、途中までしか読み取れていない可能性があります。分けて貼り付けてください）':'');
    aiRows=(d.leads||[]).filter(function(x){return x&&x.name;}).map(function(x){return {name:x.name||'',pref:x.pref||'',field:FIELDS.indexOf(x.field)>=0?x.field:'その他・未定',contact:x.contact||'',tel:x.tel||'',people:x.people==null?'':x.people,memo:x.memo||'',sel:true,dup:''};});
    markDups(); aiRows.forEach(function(r){if(r.dup)r.sel=false;});
    if(!aiRows.length)aiErr='会社を読み取れませんでした。会社名が含まれているか確認してください。';

function todokeDiff(before,after){

  PROFILE_ROWS.forEach(function(R){if(R.todoke&&JSON.stringify(ntStrip(R,before[R.k]))!==JSON.stringify(ntStrip(R,after[R.k])))out.push({l:R.t,old:sh(ntStrip(R,before[R.k])),nw:sh(ntStrip(R,after[R.k])),oldRaw:JSON.parse(JSON.stringify(before[R.k]||[])),nwRaw:JSON.parse(JSON.stringify(after[R.k]||[]))});});

}

function todokeChanges(before,after){

/* 同じ日に同じ項目を続けて直したときは、記録を1つにまとめる（元の値は最初のまま、新しい値だけ入れ替える） */
function mergeTodokeLog(log,df,staffAdd,staffDel,logBy){
  var nid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);},t0=ymd(new Date());
  if(df.length){
    var ex=log.filter(function(l){return l.kind==='change'&&!l.filed&&l.at===t0;})[0];
    if(!ex){log.push({id:nid(),kind:'change',at:t0,items:df,filed:'',by:logBy});}
    else{df.forEach(function(x){var it=(ex.items||[]).filter(function(y){return y.l===x.l;})[0];if(it)it.nw=x.nw;else ex.items.push(x);});
      ex.items=ex.items.filter(function(y){return String(y.old||'')!==String(y.nw||'');});
      if(!ex.items.length)log.splice(log.indexOf(ex),1);}
  }
  /* 元に戻した項目（変更なし）は記録から外す */
  log.slice().forEach(function(l){if(l.kind==='change'&&!l.filed&&l.at===t0&&!df.some(function(x){return (l.items||[]).some(function(y){return y.l===x.l;});})&&df.length===0){l.items=[];}});
  for(var i=log.length-1;i>=0;i--){if(log[i].kind==='change'&&!(log[i].items||[]).length)log.splice(i,1);}
  if(staffAdd.length||staffDel.length){
    var es=log.filter(function(l){return l.kind==='staff'&&!l.notified&&l.at===t0;})[0];
    if(!es){log.push({id:nid(),kind:'staff',at:t0,add:staffAdd,del:staffDel,notified:'',by:logBy});}
    else{var A=(es.add||[]).concat(staffAdd),D2=(es.del||[]).concat(staffDel);es.add=A.filter(function(n,i,a){return a.indexOf(n)===i&&D2.indexOf(n)<0;});es.del=D2.filter(function(n,i,a){return a.indexOf(n)===i&&A.indexOf(n)<0;});
      if(!es.add.length&&!es.del.length)log.splice(log.indexOf(es),1);}
  }
}

  if(r.data&&r.data.ok===false)return r.data.message||'失敗しました';
  return '';
}

/* ---------- 大房への依頼（O-Link をRSOの中で使う） ----------
   O-Link（share.html）を毎回最新のまま読み込み、通信だけRSOのサーバー（olink）を通す。
   O-Linkの鍵（URLトークン・パスワード）はサーバーの中だけにあり、この画面には来ない。 */
var OLINK_SRC=['https://ofusa2026.github.io/org-view/share.html','https://raw.githubusercontent.com/Ofusa2026/org-view/main/share.html'];
var OLINK_BASE='https://ofusa2026.github.io/org-view/';
var OLINK_ANKEN='https://ehwlgbwpycglmopiqyty.supabase.co';
var OLINK_GAS='https://script.google.com/macros/';
var olinkState={checked:false,linked:false,name:'',html:null,err:''};
async function olinkStatus(){
  if(!me||!db)return false;               /* ログインの確認が終わるまでは聞かない */
  try{var r=await db.functions.invoke('olink',{body:{action:'status'}});var e=await fnError(r);if(e)throw new Error(e);
    olinkState.linked=!!r.data.linked;olinkState.name=r.data.name||'';olinkState.checked=true;olinkState.err='';}
  catch(e){olinkState.err=(e&&e.message)||'確認できませんでした';return false;}   /* 失敗は「未連携」扱いにしない */
  $('nav-olink').hidden=!olinkState.linked;$('grp-ofusa').hidden=!olinkState.linked;return true;
}
/* iframe の中の fetch から呼ばれる。大房のDB・GAS あての通信を、RSOのサーバー経由に置きかえる */
async function olinkFetch(url,opts){
  opts=opts||{};var req;
  var bodyObj=null;try{bodyObj=opts.body?JSON.parse(opts.body):null;}catch(e){bodyObj=null;}
  if(url.indexOf(OLINK_ANKEN+'/rest/v1/rpc/')===0)req={kind:'rpc',name:url.slice((OLINK_ANKEN+'/rest/v1/rpc/').length).split('?')[0],body:bodyObj||{}};
  else if(url.indexOf(OLINK_ANKEN+'/functions/v1/')===0)req={kind:'fn',name:url.slice((OLINK_ANKEN+'/functions/v1/').length).split('?')[0],body:bodyObj||{}};
  else if(url.indexOf(OLINK_ANKEN+'/storage/v1/object/sign/')===0)req={kind:'sign',path:decodeURIComponent(url.slice((OLINK_ANKEN+'/storage/v1/object/sign/').length))};
  else if(url.indexOf(OLINK_GAS)===0)req={kind:'gas',url:url};
  else return new Response(JSON.stringify({error:'RSOからは使えない通信です'}),{status:403,headers:{'Content-Type':'application/json'}});
  var r=await db.functions.invoke('olink',{body:Object.assign({action:'call'},req)});
  var err=await fnError(r);
  if(err)return new Response(JSON.stringify({error:err,message:err}),{status:502,headers:{'Content-Type':'application/json'}});
  return new Response(r.data.body,{status:r.data.status||200,headers:{'Content-Type':r.data.type||'application/json'}});
}
window.RSO_OLINK={fetch:olinkFetch};
var OLINK_SHIM='<script>(function(){var P=window.parent,A="'+OLINK_ANKEN+'",G="'+OLINK_GAS+'",of=window.fetch.bind(window);'+
  'window.fetch=function(u,o){var url=typeof u==="string"?u:(u&&u.url)||"";if(url.indexOf(A)===0||url.indexOf(G)===0)return P.RSO_OLINK.fetch(url,o||{});return of(u,o);};'+
  'window.__RSO_EMBED=true;})();<\/script>';
async function olinkLoadHtml(){
  var last='';
  for(var i=0;i<OLINK_SRC.length;i++){
    try{var r=await fetch(OLINK_SRC[i]+'?rso='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);var t=await r.text();if(t.indexOf('function getParam(')<0)throw new Error('形式');return t;}
    catch(e){last=e.message;}
  }
  throw new Error('O-Linkの画面を読み込めませんでした（'+last+'）');
}
function olinkPatch(html){
  var gp='function getParam(k){return new URLSearchParams(location.search).get(k);}';
  if(html.indexOf(gp)<0)throw new Error('O-Linkの作りが変わったため、RSOで開けません。システム担当に連絡してください（getParam）');
  html=html.replace(gp,'function getParam(k){if(k==="token")return "rso";return new URLSearchParams(location.search).get(k);}');
  var head=html.search(/<head[^>]*>/i);if(head<0)throw new Error('O-Linkの画面の形式が想定と違います');
  var end=html.indexOf('>',head)+1;
  return html.slice(0,end)+'<base href="'+OLINK_BASE+'">'+OLINK_SHIM+html.slice(end);
}

      '<iframe id="olinkFrame" title="O-Link" style="width:100%;height:calc(100vh - 170px);min-height:560px;border:1px solid var(--line);border-radius:10px;background:#fff"></iframe>';
    $('olinkFrame').srcdoc=olinkState.html;el.dataset.built='1';
  }catch(e){el.dataset.built='';el.innerHTML='<div class="msg">'+esc(e.message)+'</div><div style="margin-top:8px"><button class="btn btn-sm" id="olRetry">もう一度読み込む</button></div>';$('olRetry').onclick=function(){renderOlink(true);};}
}

var hEdit=false,hDraft=null;
function renderHearing(){
  var el=$('hList'),ed=canEditOrg();
  if(!ed)hEdit=false;
  el.className='hcols'+(hEdit?' hedit':'');
  var bar='<div style="grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px">'+(ed?(hEdit?'<button class="btn btn-sm btn-primary" id="hDone">編集を終える</button><button class="btn btn-sm" id="hReset">初期の項目に戻す</button><span class="hint" style="margin:0">変更は自動で保存されます。消した項目に入力済みの内容は、リード側のデータには残ります（画面に出なくなるだけです）。</span>':'<button class="btn btn-sm" id="hEditBtn">項目を編集する</button><span class="hint" style="margin:0">項目名・選択肢・説明の変更、項目やグループの追加・削除・並べ替えができます。</span>'):'<span class="hint" style="margin:0">項目の編集は管理者ができます。</span>')+'</div>';
  if(!hEdit){
    el.innerHTML=bar+HEARING.map(function(g,gi){return '<div class="kcard"><h3>'+(gi+1)+'. '+esc(g.g)+'</h3><ol>'+g.items.map(function(it){return '<li><b>'+esc(it.l)+'</b>'+(it.t==='sel'?' <span class="opt">（'+esc(it.o.length>6?'分野の一覧から選択':it.o.join('／'))+'、または直接記入）</span>':'')+'<span class="why">'+esc(it.why)+'</span></li>';}).join('')+'</ol></div>';}).join('');
  }else{
    if(!hDraft)hDraft=JSON.parse(JSON.stringify(HEARING));
    var ib='class="btn btn-sm ib"';
    el.innerHTML=bar+hDraft.map(function(g,gi){
      return '<div class="kcard"><div class="hgh"><span class="sub num">'+(gi+1)+'.</span><input type="text" data-hg="'+gi+'" value="'+esc(g.g)+'" placeholder="グループ名"><button '+ib+' data-hact="gup|'+gi+'" title="上へ">↑</button><button '+ib+' data-hact="gdn|'+gi+'" title="下へ">↓</button><button '+ib+' data-hact="gdel|'+gi+'" title="このグループを削除" style="color:#c53030">グループ削除</button></div>'+
      g.items.map(function(it,ii){var k=gi+'|'+ii;
        return '<div class="hit"><div class="hhead"><span>項目 '+(ii+1)+'</span><span class="acts"><button '+ib+' data-hact="up|'+k+'" title="上へ">↑</button><button '+ib+' data-hact="dn|'+k+'" title="下へ">↓</button><button '+ib+' data-hact="del|'+k+'" style="color:#c53030">削除</button></span></div>'+
        '<div class="hrow"><label>項目名</label><div class="top"><input type="text" data-hf="'+k+'|l" value="'+esc(it.l)+'" placeholder="例：採用したい時期"><select data-hf="'+k+'|t" title="入力のしかた"><option value="text"'+(it.t==='text'?' selected':'')+'>文字で入力</option><option value="num"'+(it.t==='num'?' selected':'')+'>数字で入力</option><option value="sel"'+(it.t==='sel'?' selected':'')+'>候補から選ぶ</option></select></div>'+
        (it.t==='sel'?'<label>候補</label><input type="text" data-hf="'+k+'|o" value="'+esc((it.o||[]).join('、'))+'" placeholder="「、」で区切る　例：3か月以内、半年以内、未定">':'')+
        '<label>説明</label><input type="text" data-hf="'+k+'|why" value="'+esc(it.why||'')+'" placeholder="なぜ聞くか（入力画面に小さく表示されます）"></div></div>';}).join('')+
      '<button class="btn btn-sm" data-hact="add|'+gi+'">＋ このグループに項目を追加</button></div>';}).join('')+
      '<div><button class="btn btn-sm" data-hact="gadd|0">＋ グループを追加</button></div>';
  }
}
async function saveHearing(){
  if(!canEditOrg()||!hDraft)return;
  var bad=null;hDraft.forEach(function(g){g.items.forEach(function(it){if(!String(it.l||'').trim())bad='項目名が空欄の項目があります';if(it.t==='sel'&&!(it.o||[]).length)bad='「候補から選ぶ」の項目に候補がありません';});});
  if(bad)throw new Error(bad);
  var cl=hClean(hDraft)||[];
  var p=JSON.parse(JSON.stringify(myOrg.profile||{}));p.hearing_def=cl;
  var r=must(await db.from('orgs').update({profile:p,updated_at:new Date().toISOString()}).eq('id',myOrg.id).select('*'));
  if(!r||!r.length)throw new Error('保存する権限がありません');
  myOrg=r[0];applyHearing();AS.ok=true;
}
function hAuto(){autoSave(function(){return saveHearing();});}
(function(){
  var box=$('hList');
  box.addEventListener('input',function(e){var t=e.target;if(!hDraft)return;
    if(t.dataset.hg!=null){hDraft[+t.dataset.hg].g=t.value;hAuto();return;}
    if(t.dataset.hf){var p=t.dataset.hf.split('|'),it=hDraft[+p[0]].items[+p[1]],f=p[2];
      if(f==='o')it.o=t.value.split(/[、,，\n]/).map(function(x){return x.trim();}).filter(Boolean);else if(f==='t')return;else it[f]=t.value;hAuto();}});
  box.addEventListener('change',function(e){var t=e.target;if(!hDraft||!t.dataset.hf)return;var p=t.dataset.hf.split('|');
    if(p[2]==='t'){var it=hDraft[+p[0]].items[+p[1]];it.t=t.value;if(it.t==='sel'&&!(it.o||[]).length)it.o=[];renderHearing();hAuto();}});
  box.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
    if(b.id==='hEditBtn'){hEdit=true;hDraft=JSON.parse(JSON.stringify(HEARING));renderHearing();return;}
    if(b.id==='hDone'){autoFlush().then(function(){hEdit=false;hDraft=null;renderHearing();});return;}
    if(b.id==='hReset'){if(!confirm('ヒアリング項目を初期の状態に戻します。よろしいですか？'))return;
      var p=JSON.parse(JSON.stringify(myOrg.profile||{}));delete p.hearing_def;
      db.from('orgs').update({profile:p,updated_at:new Date().toISOString()}).eq('id',myOrg.id).select('*').then(function(r){if(r.error||!r.data||!r.data.length){toast('戻せませんでした');return;}myOrg=r.data[0];applyHearing();hDraft=JSON.parse(JSON.stringify(HEARING));renderHearing();toast('初期の項目に戻しました');});return;}
    if(!b.dataset.hact||!hDraft)return;var a=b.dataset.hact.split('|'),w=a[0],gi=+a[1],ii=+a[2];
    var mv=function(arr,i,d){var j=i+d;if(j<0||j>=arr.length)return;var x=arr[i];arr[i]=arr[j];arr[j]=x;};
    if(w==='gup')mv(hDraft,gi,-1);else if(w==='gdn')mv(hDraft,gi,1);
    else if(w==='gdel'){var n=hDraft[gi].items.length;if(n&&!confirm('「'+hDraft[gi].g+'」と中の'+n+'項目を消します。よろしいですか？'))return;hDraft.splice(gi,1);}
    else if(w==='gadd')hDraft.push({g:'新しいグループ',items:[{id:'h_'+Math.random().toString(36).slice(2,8),l:'新しい項目',t:'text',o:[],why:''}]});
    else if(w==='add')hDraft[gi].items.push({id:'h_'+Math.random().toString(36).slice(2,8),l:'新しい項目',t:'text',o:[],why:''});
    else if(w==='up')mv(hDraft[gi].items,ii,-1);else if(w==='dn')mv(hDraft[gi].items,ii,1);
    else if(w==='del')hDraft[gi].items.splice(ii,1);
    renderHearing();hAuto();});
})();

async function boot(){
  if(!window.supabase||SUPABASE_URL.indexOf('YOUR-')>=0){
    $('loginView').hidden=false; var m=$('loginMsg'); m.hidden=false;
    m.textContent=!window.supabase?'接続用のライブラリを読み込めませんでした。通信環境を確認して再読み込みしてください。':'Supabase の接続先がまだ設定されていません（SUPABASE_URL と SUPABASE_KEY）。';
    return;
  }
  db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  var ses=(await db.auth.getSession()).data.session;

async function startApp(ses){
  $('loginView').hidden=true; $('appView').hidden=false;

  try{
    me=must(await db.from('members').select('*').eq('user_id',ses.user.id).maybeSingle());
    if(!me){var n0=$('dbNotice');n0.hidden=false;n0.textContent='このアカウントは、どの登録支援機関にも所属していません。運営に連絡してください。';return;}
    myOrg=must(await db.from('orgs').select('*').eq('id',me.org_id).single());applyHearing();
    $('sbUser').textContent=(myOrg.name||'')+'　'+(ses.user.email||'')+'（'+ROLE_NAME[me.role]+'）';

  }catch(e){var n1=$('dbNotice');n1.hidden=false;n1.textContent='所属の読み込みに失敗しました：'+(e&&e.message||'');return;}
  try{await loadAll();}catch(e){var n=$('dbNotice');n.hidden=false;n.textContent='データを読み込めませんでした：'+(e&&e.message||'');}
  window.RSO_READY=true;if(window.RSOX)window.RSOX.start().catch(function(){});
  if(!startApp._t)startApp._t=setInterval(function(){if(document.visibilityState!=='visible'||!$('drawer').hidden)return;if(window.RSOX&&window.RSOX.busy())return;loadAll().catch(function(){});if(window.RSOX&&isXView(view)&&!window.RSOX.views[view].chat)window.RSOX.refresh().catch(function(){});},60000);
}
$('liBtn').addEventListener('click',async function(){

  var r=await db.auth.signInWithPassword({email:$('liEmail').value.trim(),password:$('liPass').value});
  if(r.error){m.hidden=false;m.textContent='ログインできませんでした。メールアドレスとパスワードを確認してください。';return;}

});

async function fetchAll(t,ord,filt){
  var out=[],from=0;
  for(;;){var q=db().from(t).select('*');if(filt)q=filt(q);if(ord)q=q.order(ord[0],{ascending:ord[1]!==false,nullsFirst:false});
    var r=must(await q.range(from,from+999));out=out.concat(r);if(r.length<1000)break;from+=1000;}
  return out;
}

function secOrder(mod,tab){
  var seen=[],m={};
  KF[mod].forEach(function(f){if(f[2]!==tab)return;if(!m[f[3]]){m[f[3]]=[];seen.push(f[3]);}m[f[3]].push(f);});
  var pref=(SEC_ORDER[mod]||{})[tab];
  if(pref){seen.sort(function(a,b){var x=pref.indexOf(a),y=pref.indexOf(b);if(x<0)x=999;if(y<0)y=999;return x-y;});}
  else seen.sort(function(a,b){var x=parseFloat(a)||0,y=parseFloat(b)||0;return x-y;});
  return seen.map(function(s){return {s:s,f:m[s]};});
}

function staffChangeLog(old,row){
  var nm=function(c){return splitNames(c&&c.main_staff).concat(splitNames(c&&c.sub_staff)).filter(function(n,i,a){return a.indexOf(n)===i;});};
  var b=nm(old),a=nm(row),add=a.filter(function(n){return b.indexOf(n)<0;}),del=b.filter(function(n){return a.indexOf(n)<0;});

  tlSave(function(log){
    var ex=log.filter(function(l){return l.kind==='staff'&&l.company_id===row.id&&!l.notified&&l.at===t0;})[0];
    if(!ex){log.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),kind:'staff',at:t0,company_id:row.id,co:row.name||'',add:add,del:del,notified:'',by:myName()});return;}

/* 実施済にできるか。ガイダンス3時間・オリエンテーション8時間の合計、実施方法（対面／オンライン）を確かめる */
function hoursOf(s){var r=s.record||{},h=Number(r.hours);if(h>0)return h;if(!s.all_day&&s.start_time&&s.end_time){var a=String(s.start_time).split(':'),b=String(s.end_time).split(':'),m=(Number(b[0])*60+Number(b[1]||0))-(Number(a[0])*60+Number(a[1]||0));if(m>0)return m/60;}return 0;}
function doneProblem(s){
  var t=s.event_type,nm=(byId(D.wk,s.worker_id)||{}).name||'';
  if(HOURS_MIN[t]){
    var m=(s.record||{}).method;
    if(!m)return '実施方法（対面・訪問・オンライン）を選んでください。電話・メールでは実施したことになりません';
    if(METHODS_STRICT.indexOf(m)<0)return '「'+m+'」では実施したことになりません。対面・訪問・オンライン（テレビ電話）のどれかです';
    var tot=hoursOf(s)+D.sc.filter(function(x){return x.worker_id===s.worker_id&&x.event_type===t&&x.id!==s.id;}).reduce(function(a,x){return a+hoursOf(x);},0);
    if(tot<HOURS_MIN[t]-1e-9)return (nm?nm+'：':'')+EVT_BY[t].l+'は合計'+HOURS_MIN[t]+'時間以上必要です（いまの合計 '+(Math.round(tot*100)/100)+'時間）。実施時間を入れてください';
  }
  if(t==='periodic_meeting'&&s.event_method!=='online'&&s.event_method!=='visit')return '定期面談の実施方法（オンライン／訪問）を選んでください';
  return '';
}
async function saveSched(d,isNew){
  if(!d.event_type){toast('種別を選んでください');return;}
  var wids=isNew?d.wids:[d.worker_id];if(!wids.length||!wids[0]){toast('人材を選択してください');return;}
  if(d.monthOnly?!d.plan_ym:!d.scheduled_at){toast('日付を入れてください');return;}
  if(!d.all_day&&!d.start_time){toast('開始時間を入れてください（時間がなければ「一日中」にします）');return;}
  var per=d.event_type==='periodic_meeting';
  if(HOURS_MIN[d.event_type]){d.record=d.record||{};if(!(Number(d.record.hours)>0)){var h0=hoursOf(d);if(h0>0)d.record.hours=String(Math.round(h0*100)/100);}}
  if(d.status==='done'){for(var pi=0;pi<wids.length;pi++){var pr=doneProblem(Object.assign({},d,{worker_id:wids[pi]}));if(pr){toast(pr);return;}}}
  else if(HOURS_MIN[d.event_type]&&d.record&&d.record.method&&METHODS_STRICT.indexOf(d.record.method)<0){toast('「'+d.record.method+'」は認められません。対面・訪問・オンラインのどれかを選んでください');return;}
  var base={event_type:d.event_type,event_method:per?(d.event_method||null):null,scheduled_at:d.monthOnly?null:d.scheduled_at,plan_ym:d.monthOnly?d.plan_ym:null,all_day:!!d.all_day,start_time:d.all_day?null:(d.start_time||null),end_time:d.all_day?null:(d.end_time||null),status:d.status||'planned',completed_at:d.status==='done'&&!d.monthOnly?d.scheduled_at:null,notes:per?(d.memo||null):(d.notes||null),staff_names:d.staff_names||[],other_label:d.event_type==='other_support'?(d.other_label||null):null,place:d.place||null,interpreter:d.interpreter||null,record:d.record||{},updated_at:nowIso(),updated_by:myName()};
  try{
    if(!isNew){var row=await q1(db().from('support_schedules').update(Object.assign(base,{worker_id:d.worker_id,company_id:d.company_id||(byId(D.wk,d.worker_id)||{}).company_id||null})).eq('id',d.id).select().single());replaceIn(D.sc,row);if(!d.monthOnly)await syncScheduleToWorker(row);await saveSchedMeeting(row,d.memo,d.result);toast('更新しました');if(!window.__AUTO)closeSmall();afterChange();return;}
    var skip=[],made=0;
    for(var i=0;i<wids.length;i++){var w=byId(D.wk,wids[i])||{};
      var dup=D.sc.some(function(s){return s.worker_id===wids[i]&&s.event_type===d.event_type&&(d.monthOnly?(!s.scheduled_at&&s.plan_ym===d.plan_ym):s.scheduled_at===d.scheduled_at);});
      if(dup){skip.push(w.name||'');continue;}
      var r=await q1(db().from('support_schedules').insert(Object.assign({},base,{worker_id:wids[i],company_id:w.company_id||d.company_id||null})).select().single());replaceIn(D.sc,r);made++;
      if(!d.monthOnly)await syncScheduleToWorker(r);await saveSchedMeeting(r,d.memo,d.result);
      if(d.event_type==='placement'&&d.withOri&&!d.monthOnly){var has=D.sc.some(function(s){return s.worker_id===wids[i]&&s.event_type==='life_orientation'&&s.scheduled_at===d.scheduled_at;});
        if(!has){var r2=await q1(db().from('support_schedules').insert(Object.assign({},base,{event_type:'life_orientation',event_method:null,other_label:null,record:{},worker_id:wids[i],company_id:r.company_id})).select().single());replaceIn(D.sc,r2);await syncScheduleToWorker(r2);}}
    }
    toast(made+'件の予定を登録しました'+(skip.length?'（同じ日・同じ種別の予定がある '+skip.join('、')+' は飛ばしました）':''));
    closeSmall();afterChange();
  }catch(e){toast('保存できませんでした：'+(e.message||''));}
}

async function saveJob(){
  var dr=M.dr,old=M.orig||{};

function orgId(){return (R.org()||{}).id;}
function linkify(t){return esc(t).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/(^|\s)(@[^\s@]+)/g,'$1<span class="mention">$2</span>');}
function mentionNames(){return ['全員'].concat(D.members.map(memberName));}
function parseMentions(text){var out=[],names=mentionNames();names.forEach(function(n){if(text.indexOf('@'+n)>=0){if(n==='全員')out.push('all');else{var m=D.members.filter(function(x){return memberName(x)===n;})[0];if(m)out.push(m.user_id);}}});return uniq(out);}
function sizeTxt(n){return n>1048576?(n/1048576).toFixed(1)+'MB':Math.ceil(n/1024)+'KB';}
async function uploadFiles(files,folder){
  var out=[];for(var i=0;i<files.length;i++){var f=files[i];if(f.size>20*1048576){toast(f.name+' は20MBを超えているので送れません');continue;}
    var path=orgId()+'/'+folder+'/'+Date.now()+'_'+i+'_'+f.name.replace(/[^\w.\-]+/g,'_');
    var r=await db().storage.from('rso-files').upload(path,f,{contentType:f.type||'application/octet-stream'});
    if(r.error){toast('ファイルを送れませんでした：'+r.error.message);continue;}out.push({path:path,name:f.name,type:f.type||'',size:f.size});}
  return out;
}

function auditField(t,k){var m=AUDIT_F[t];if(m&&m[k])return m[k];var kf=AUDIT_KF[t]&&KF[AUDIT_KF[t]];if(kf){for(var i=0;i<kf.length;i++)if(kf[i][0]===k)return kf[i][1];}
  var pf={reg_no:'登録番号',corp_name:'名称',staff:'支援責任者・支援担当者',employees:'支援担当者にならない従業員',officers:'役員',offices:'事務所',langs:'対応言語'};return pf[k]||k;}
function auditVal(t,k,v){
  if(v==null||v==='')return '（空）';
  if(t==='support_schedules'&&k==='event_type'&&EVT_BY[v])return EVT_BY[v].l;
  if((k==='worker_id')&&byId(D.wk,v))return byId(D.wk,v).name;
  if((k==='company_id')&&coOf(v))return coOf(v).name;
  if(k==='role')return {member:'一般',admin:'管理者',operator:'運営'}[v]||v;
  if(typeof v==='boolean')return v?'はい':'いいえ';
  var s=typeof v==='object'?JSON.stringify(v):String(v);return s.length>80?s.slice(0,80)+'…':s;}
function auditLabel(r){var c=r.changes||{},t=r.table_name;
  if(t==='support_schedules'){var w=byId(D.wk,(c.worker_id&&c.worker_id.new)||c.worker_id)||{},e=EVT_BY[(c.event_type&&c.event_type.new)||c.event_type];
    if(r.action!=='UPDATE')return [(e||{}).l,w.name,r.label].filter(Boolean).join('　');var s=byId(D.sc,r.row_id);if(s)return [(EVT_BY[s.event_type]||{}).l,(byId(D.wk,s.worker_id)||{}).name,schedDate(s)].filter(Boolean).join('　');}
  if(t==='workers'||t==='companies'||t==='candidates'){var x=t==='workers'?byId(D.wk,r.row_id):t==='companies'?coOf(r.row_id):byId(D.cands,r.row_id);if(x&&x.name)return x.name;}
  return r.label||'';}
function auditBody(r){var c=r.changes||{},t=r.table_name;
  if(r.action==='UPDATE'){var ks=Object.keys(c);return ks.slice(0,8).map(function(k){var o=c[k]||{};
      if(t==='orgs'&&k==='profile'&&o.old&&o.new&&typeof o.old==='object'){var sub=[];Object.keys(Object.assign({},o.old,o.new)).forEach(function(kk){if(JSON.stringify(o.old[kk])!==JSON.stringify(o.new[kk]))sub.push(esc(auditField(t,kk)));});return '<div>機関情報：'+sub.join('、')+' を変更</div>';}
      return '<div><b>'+esc(auditField(t,k))+'</b>：<span class="sub">'+esc(auditVal(t,k,o.old))+'</span> → '+esc(auditVal(t,k,o.new))+'</div>';}).join('')+(ks.length>8?'<div class="sub">ほか'+(ks.length-8)+'項目</div>':'');}
  var keys=Object.keys(c).filter(function(k){return ['id','org_id','created_at','updated_at','updated_by','created_by'].indexOf(k)<0&&c[k]!=null&&c[k]!==''&&!(Array.isArray(c[k])&&!c[k].length)&&!(typeof c[k]==='object'&&!Array.isArray(c[k])&&!Object.keys(c[k]).length);});
  return '<details><summary class="sub" style="cursor:pointer">'+(r.action==='DELETE'?'消した内容':'入れた内容')+'（'+keys.length+'項目）</summary>'+keys.map(function(k){return '<div><b>'+esc(auditField(t,k))+'</b>：'+esc(auditVal(t,k,c[k]))+'</div>';}).join('')+'</details>';}
async function auditLoad(append){
  var from=append?VA.rows.length:0;
  var q=db().from('audit_log').select('*').order('at',{ascending:false}).range(from,from+199);
  if(VA.from)q=q.gte('at',VA.from+'T00:00:00+09:00');if(VA.to)q=q.lte('at',VA.to+'T23:59:59+09:00');
  if(VA.t)q=q.eq('table_name',VA.t);if(VA.a)q=q.eq('action',VA.a);
  if(VA.q){var w=VA.q.replace(/[%,()]/g,' ');q=q.or('label.ilike.%'+w+'%,user_name.ilike.%'+w+'%');}
  var r=await q;
  if(r.error){VA.err=/audit_log/.test(r.error.message||'')?'操作の記録のDBがまだ準備されていません（sql/20261105_security_audit.sql の実行が必要です）':'読み込めませんでした：'+(r.error.message||'');VA.rows=[];VA.more=false;return;}
  VA.err='';VA.rows=append?VA.rows.concat(r.data||[]):(r.data||[]);VA.more=(r.data||[]).length===200;
}
function auditCheckHtml(){
  if(me().role!=='operator')return '';
  var c=VA.chk;
  return '<div class="xsec" style="margin-bottom:14px"><div class="xsec-t">機関ごとの区切りの点検（運営だけ）</div>'+
    '<div class="sub" style="margin-bottom:8px">DBの全テーブルについて、ほかの機関のデータが見えたり書き換えられたりする設定がないかを調べます。テーブルを足したあとは、必ず実行してください。新しく作ったテーブルは自動で「だれも触れない」状態から始まります。</div>'+
    '<div class="toolbar"><button class="btn btn-primary btn-sm" id="auChk">点検を実行</button><button class="btn btn-sm" id="auAttach">操作の記録を付け直す</button><span class="sub">'+esc(VA.chkMsg)+'</span></div>'+
    (c?(c.length?'<div class="tablewrap" style="margin-top:8px"><table><thead><tr><th>テーブル</th><th>重さ</th><th>内容</th></tr></thead><tbody>'+c.map(function(x){return '<tr><td>'+esc(x.table_name)+'<div class="sub">'+esc(AUDIT_T[x.table_name]||'')+'</div></td><td>'+chip(x.level,x.level==='危険'?'#c53030':'#b7791f',x.level==='危険'?'#fff5f5':'#fffbeb')+'</td><td>'+esc(x.problem)+'</td></tr>';}).join('')+'</tbody></table></div>'
      :'<div style="margin-top:8px;color:#2f855a;font-weight:700">問題は見つかりませんでした（全テーブルが機関ごとに区切られています）</div>'):'')+'</div>';
}
async function renderAudit(){
  var el=$('v-audit');var m=me();
  if(m.role!=='admin'&&m.role!=='operator'){el.innerHTML='<div class="empty">操作の記録は管理者だけが見られます。</div>';return;}
  if(!VA.from){VA.from=addDays(today(),-30);VA.to=today();}
  if(!VA._loaded){VA._loaded=true;await auditLoad(false);}
  var types=Object.keys(AUDIT_T).map(function(k){return [k,AUDIT_T[k]];});
  el.innerHTML=auditCheckHtml()+
   '<div class="filters" style="display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin-bottom:10px">'+
    '<label class="sub">期間 <input type="date" id="auFrom" value="'+esc(VA.from)+'"></label><label class="sub">〜 <input type="date" id="auTo" value="'+esc(VA.to)+'"></label>'+
    '<select id="auT">'+optHtml(types,VA.t,'すべての種類')+'</select><select id="auA">'+optHtml([['INSERT','追加'],['UPDATE','変更'],['DELETE','削除']],VA.a,'すべての操作')+'</select>'+
    '<input type="text" id="auQ" placeholder="対象の名前・ユーザー名で検索" value="'+esc(VA.q)+'"><button class="btn btn-sm" id="auGo">表示</button></div>'+
   (VA.err?'<div class="msg">'+esc(VA.err)+'</div>':'')+
   (VA.rows.length?'<div class="tablewrap"><table><thead><tr><th>日時</th><th>ユーザー</th><th>操作</th><th>種類</th><th>対象</th><th>内容</th></tr></thead><tbody>'+VA.rows.map(function(r){var a=AUDIT_A[r.action]||[r.action];
      return '<tr><td class="num" style="white-space:nowrap">'+esc(dt(r.at))+'<div class="sub">'+esc(String(r.at).slice(0,4))+'</div></td><td>'+esc(r.user_name||'—')+'</td><td>'+chip(a[0],a[1],a[2])+'</td><td style="white-space:nowrap">'+esc(AUDIT_T[r.table_name]||r.table_name)+'</td><td>'+esc(auditLabel(r))+'</td><td style="font-size:12px;max-width:520px">'+auditBody(r)+'</td></tr>';}).join('')+'</tbody></table></div>'
     :(VA.err?'':'<div class="empty">この条件の記録はありません。</div>'))+
   (VA.more?'<div style="text-align:center;margin-top:10px"><button class="btn" id="auMore">さらに表示</button></div>':'')+
   '<div class="hint" style="margin-top:8px">追加・変更・削除はDBが自動で記録します。記録はだれも変更・削除できません（管理者・運営が自分の機関の分を見るだけ）。チャットの既読は記録しません。</div>';
  var go=async function(){VA.from=$('auFrom').value;VA.to=$('auTo').value;VA.t=$('auT').value;VA.a=$('auA').value;VA.q=$('auQ').value.trim();await auditLoad(false);renderAudit();};
  $('auGo').onclick=go;$('auQ').onkeydown=function(e){if(e.key==='Enter')go();};['auFrom','auTo','auT','auA'].forEach(function(i){$(i).onchange=go;});
  if($('auMore'))$('auMore').onclick=async function(){this.disabled=true;await auditLoad(true);renderAudit();};
  if($('auChk'))$('auChk').onclick=async function(){this.disabled=true;var r=await db().rpc('rls_audit');if(r.error){VA.chkMsg='実行できませんでした：'+r.error.message;VA.chk=null;}else{VA.chk=r.data||[];VA.chkMsg='点検日時 '+dt(new Date().toISOString());}renderAudit();};
  if($('auAttach'))$('auAttach').onclick=async function(){this.disabled=true;var r=await db().rpc('rso_attach_audit');VA.chkMsg=r.error?'実行できませんでした：'+r.error.message:r.data+'個のテーブルに操作の記録を付けました';renderAudit();};
}

/* ---------- 届出・期限 ----------
   ① 特異事案の報告（4-3）…14日以内　② 登録事項の変更届出…14日以内（4-4）　③ 支援責任者・担当者の変更　（定期面談は別メニュー renderMeeting）
   ※ 定期届出（3-6号＋別紙）の人材一覧の出力は、大房への依頼を残すため今は載せない（setup.sql のメモ参照） */
function addMonthsStr(s,n){var d=new Date(s+'T00:00:00'),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);var last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return R.ymd(d);}
function pill(c,t){var m={bad:['#c53030','#fff5f5'],warn:['#b7791f','#fffaf0'],ok:['#2f855a','#f0fff4'],info:['#2b6cb0','#ebf8ff'],na:['#718096','#edf2f7']}[c]||['#4a5568','#edf2f7'];return '<span style="display:inline-block;padding:1px 8px;border-radius:10px;font-size:11.5px;font-weight:700;white-space:nowrap;color:'+m[0]+';background:'+m[1]+'">'+esc(t)+'</span>';}
function tlog(){var pf=(R.org()||{}).profile||{};return Array.isArray(pf.todoke_log)?pf.todoke_log:[];}
function isAdminOrg(){var m=R.me();return !!m&&(m.role==='admin'||m.role==='operator');}
async function tlSave(mut){
  var o=R.org(),pf=JSON.parse(JSON.stringify(o.profile||{}));pf.todoke_log=Array.isArray(pf.todoke_log)?pf.todoke_log:[];mut(pf.todoke_log);
  var r=await R.db().from('orgs').update({profile:pf,updated_at:nowIso()}).eq('id',o.id).select('id');
  if(r.error||!r.data||!r.data.length){toast('保存できませんでした（管理者だけが変更できます）');return false;}
  o.profile=pf;return true;
}
var INC_LABEL={not_done:'支援を実施しなかった（実施困難）',job_change:'転職支援（非自発的離職）',incident:'特異事案',consult:'相談から行政機関へ相談・通報'};
function incItems(){
  return D.sc.filter(function(s){if(!schedDate(s))return false;if(s.event_type==='consult')return !!String(rec(s).report||'').trim();return s.event_type==='not_done'||s.event_type==='job_change'||s.event_type==='incident';})
   .map(function(s){var r=rec(s),d=schedDate(s),by=r.r43_by||'';return {s:s,w:byId(D.wk,s.worker_id)||{},d:d,due:addDays(d,14),filed:r.r43_date||'',skip:/不要|所属機関/.test(by),left:daysTo(addDays(d,14))};})
   .sort(function(a,b){return a.d<b.d?1:-1;});
}
function incState(it){if(it.filed)return ['提出済み','ok'];if(it.skip)return ['対象外','na'];if(it.left<0)return ['期限切れ（'+(-it.left)+'日）','bad'];if(it.left<=5)return ['あと'+it.left+'日','warn'];return ['あと'+it.left+'日','info'];}
function incKind(it){var r=rec(it.s);return it.s.event_type==='incident'?('特異事案：'+(r.ikind||'種類未入力')):INC_LABEL[it.s.event_type];}
function incAttach(it){var r=rec(it.s),t=it.s.event_type;
  if(t==='not_done')return ['支援実施困難に係る理由書（5-13）'];
  if(t==='job_change')return ['転職支援実施報告書（5-12）'];
  if(t==='consult')return ['相談記録書（5-4）の写し'];
  var k=r.ikind||'';if(k==='行方不明'||k==='死亡')return ['直近の定期面談報告書（5-5／5-6）'];
  if(k==='基準不適合を把握した')return ['基準不適合等に係る説明書（5-19）','（所属機関に、基準不適合の届出〔3-5〕を促す）'];
  if(k==='行政機関に相談・通報した')return ['相談記録書（5-4）または定期面談報告書（5-5／5-6）の写し'];
  return [];}
function meetRows(){
  return D.wk.filter(function(w){return !isPast(w)&&supStart(w);}).map(function(w){
    var all=D.sc.filter(function(s){return s.worker_id===w.id&&s.event_type==='periodic_meeting'&&schedDate(s);});
    var ds=all.filter(function(s){return s.status==='done';}).map(schedDate).sort(),last=ds.length?ds[ds.length-1]:'';
    var due=addMonthsStr(last||supStart(w),3);
    var plan=all.filter(function(s){return s.status!=='done'&&schedDate(s)>=today();}).map(schedDate).sort()[0]||'';
    return {w:w,last:last,due:due,plan:plan,left:daysTo(due)};
  }).sort(function(a,b){return a.left-b.left;});
}
function meetState(m){if(m.left<0){if(m.plan&&m.plan<=m.due)return ['予定あり','info'];return ['期限切れ（'+(-m.left)+'日）','bad'];}if(m.plan&&m.plan<=m.due)return ['予定あり','ok'];if(m.left<=14)return ['あと'+m.left+'日','warn'];return ['あと'+m.left+'日','ok'];}
function todokeOverdue(){
  var n=incItems().filter(function(it){return !it.filed&&!it.skip&&it.left<0;}).length;
  n+=tlog().filter(function(l){return l.kind==='change'&&!l.filed&&daysTo(addDays(l.at,14))<0;}).length;
  return n;
}
function kv2(pairs){return '<table class="ft2">'+pairs.map(function(p){return '<tr><th style="width:30%">'+esc(p[0])+'</th><td style="white-space:pre-wrap">'+esc(p[1]||'')+'</td></tr>';}).join('')+'</table>';}
function incPairs(it){var r=rec(it.s),t=it.s.event_type;
  if(t==='not_done')return [['実施しなかった支援',r.target],['申出を受けた日',jd(r.req_date)],['申出・理由',r.req_content]];
  if(t==='job_change')return [['離職の理由',r.reason],['転職先の候補・紹介先',r.candidates],['ハローワーク等への同行',r.hellowork],['その他の支援内容',r.content]];
  if(t==='consult')return [['区分',r.ckind],['相談・苦情の内容',r.ctopic],['対応した内容・結果',r.answer],['相談・通報した行政機関',r.report]];

function todokeClick(e){
  var lk=e.target.closest('[data-ow],[data-oc]');if(lk){e.preventDefault();if(lk.dataset.ow)openWorker(lk.dataset.ow);else openCompany(lk.dataset.oc);return;}
  var b=e.target.closest('button');if(!b)return;
  if(b.dataset.prep){var pp=b.dataset.prep.split('|'),pw=byId(D.wk,pp[1]);if(pw)printForm(pp[0],{worker:pw});return;}
  if(b.dataset.osched){openSched(b.dataset.osched);return;}
  if(b.dataset.nsched){var nw=byId(D.wk,b.dataset.pw)||{};openSched(null,{worker_id:nw.id,company_id:nw.company_id,event_type:b.dataset.nsched});return;}
  if(b.dataset.newinc){openSched(null,{event_type:'incident'});return;}
  if(b.dataset.pdoc){var p=b.dataset.pdoc.split('|'),s=byId(D.sc,p[1]);if(!s)return;var it=incItems().filter(function(x){return x.s.id===s.id;})[0];if(!it)return;
    var pg=incDocPages(it,p[0]);if(!pg){toast('この事案の添付は、'+(incAttach(it)[0]||'ありません')+'です（帳簿・面談の画面から印刷します）');return;}
    openForm((p[0]==='43'?'特異事案報告書（4-3）_':'添付様式_')+(it.w.name||''),pg);return;}
  if(b.dataset.inc43){var s2=byId(D.sc,b.dataset.inc43);if(!s2)return;var dt=prompt('4-3を出入国在留管理局に提出した日（例 '+today()+'）',today());if(dt==null)return;dt=dt.trim();
    if(!/^\d{4}-\d{2}-\d{2}$/.test(dt)){toast('日付は 2026-11-05 の形で入れてください');return;}
    var nr=Object.assign({},s2.record||{},{r43_date:dt,r43_by:(s2.record||{}).r43_by||'登録支援機関が提出する（4-3）'});
    R.db().from('support_schedules').update({record:nr,updated_at:nowIso(),updated_by:myName()}).eq('id',s2.id).select().single().then(function(r){if(r.error){toast('保存できませんでした');return;}replaceIn(D.sc,r.data);toast('提出済みにしました');renderTodoke();updBadges();});return;}
  if(b.dataset.tlfile||b.dataset.tlstaff){var id=b.dataset.tlfile||b.dataset.tlstaff,isF=!!b.dataset.tlfile;
    var d2=prompt(isF?'変更の届出を提出した日（例 '+today()+'）':'所属機関に連絡した日（例 '+today()+'）',today());if(d2==null)return;d2=d2.trim();
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d2)){toast('日付は 2026-11-05 の形で入れてください');return;}
    tlSave(function(a){a.forEach(function(l){if(l.id===id){if(isF)l.filed=d2;else l.notified=d2;}});}).then(function(ok){if(ok){toast('記録しました');renderTodoke();updBadges();}});return;}
  if(b.dataset.tlprint){var lg=tlog().filter(function(l){return l.id===b.dataset.tlprint;})[0];if(!lg)return;var o=orgPf();
    openForm('登録事項の変更に関する届出書別紙（4-4）',pages44(lg));return;}
}
var VM={all:false,q:''};
function renderMeeting(){

    el.addEventListener('input',function(e){if(e.target.id==='mQ'){VM.q=e.target.value;var p=e.target.selectionStart;renderMeeting();var i=$('mQ');if(i){i.focus();try{i.setSelectionRange(p,p);}catch(x){}}}});}

  var all=meetRows(),q=String(VM.q||'').trim().toLowerCase();
  /* 初期表示：期限切れで予定がない人／期限まで14日以内で予定がない人 */

  var base=VM.all?all:need;

  var over=all.filter(function(m){return meetState(m)[1]==='bad';}).length;
  el.innerHTML='<div class="xsec"><div class="xsec-t">定期面談の間隔　<span class="sub">外国人本人・監督者の両方と、3か月に1回以上（対面またはオンライン）</span></div>'+
    '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0 10px"><input type="text" id="mQ" placeholder="氏名・所属機関で検索" value="'+esc(VM.q)+'" style="padding:6px 9px;border:1px solid var(--line);border-radius:7px;width:240px">'+
    '<button class="btn btn-sm'+(VM.all?'':' btn-primary')+'" id="mAll">'+(VM.all?'要対応だけに絞る':'すべての人を表示（'+all.length+'名）')+'</button>'+
    '<span class="sub">要対応 <b>'+need.length+'名</b>（うち期限切れ・予定なし <b style="color:#c53030">'+over+'名</b>）　全体 '+all.length+'名</span></div>'+
    (rows.length?'<table class="tbl"><thead>'+th(['人材','所属機関','最後の面談','次の期限（3か月）','予定','状態','操作'])+'</thead><tbody>'+rows.map(function(m){var st=meetState(m);
      return '<tr><td>'+lkW(m.w)+'</td><td>'+lkC(m.w.company_id)+'</td><td class="num">'+(m.last?esc(ymdj(m.last)):'<span class="sub">まだ（支援開始日から数えます）</span>')+'</td><td class="num">'+esc(ymdj(m.due))+'</td><td class="num">'+(m.plan?esc(ymdj(m.plan)):'')+'</td><td>'+pill(st[1],st[0])+'</td><td style="white-space:nowrap"><button class="btn btn-sm" data-nsched="periodic_meeting" data-pw="'+esc(m.w.id)+'">面談を登録</button> <button class="btn btn-sm" data-prep="5-5|'+esc(m.w.id)+'">5-5 出力</button> <button class="btn btn-sm" data-prep="5-6|'+esc(m.w.id)+'">5-6 出力</button></td></tr>';}).join('')+'</tbody></table><div class="hint">「5-5 出力」（外国人用）「5-6 出力」（監督者用）は、いちばん新しい面談の記録で定期面談報告書を出します。面談のあと、予定の画面で「実施済」にして記入すると、内容が入ります。</div>':
      '<div class="empty">'+(all.length?(q?'該当する人材がいません':'期限切れ・期限が近い人はいません（すべての人を見るには上のボタン）'):'支援開始日が入っている人材がいません')+'</div>')+'</div>';
}

    '<div class="hint">次のどれかを記録すると、ここに並びます。支援を実施しなかった記録／転職支援の記録／相談から労基署・ハローワーク等へ相談・通報した記録（「通報・相談した行政機関」に入力）／行方不明・死亡・基準不適合などの特異事案。支援の全部を委託されているときは、登録支援機関が4-3を出します（一部だけの委託なら所属機関が3-7を出します）。</div>'+
    (inc.length?'<table class="tbl"><thead>'+th(['発生日','人材（所属機関）','種類','報告の期限','状態','添付する書類','操作'])+'</thead><tbody>'+inc.map(function(it){var st=incState(it),at=incAttach(it);
      return '<tr><td class="num">'+esc(ymdj(it.d))+'</td><td>'+lkW(it.w)+'<div class="sub">'+lkC(it.s.company_id||it.w.company_id)+'</div></td><td>'+esc(incKind(it))+'</td><td class="num">'+esc(ymdj(it.due))+'</td><td>'+pill(st[1],st[0])+(it.filed?'<div class="sub">'+esc(ymdj(it.filed))+'</div>':'')+'</td><td style="font-size:12px">'+at.map(esc).join('<br>')+'</td>'+
        '<td style="white-space:nowrap"><button class="btn btn-sm" data-osched="'+esc(it.s.id)+'">記録を開く</button> <button class="btn btn-sm" data-pdoc="43|'+esc(it.s.id)+'">4-3を出力</button>'+(incDocPages(it,'att')?' <button class="btn btn-sm" data-pdoc="att|'+esc(it.s.id)+'">添付書類を出力</button>':'')+(it.filed?'':' <button class="btn btn-sm btn-primary" data-inc43="'+esc(it.s.id)+'">提出済みにする</button>')+'</td></tr>';}).join('')+'</tbody></table>':'<div class="empty">該当する記録はありません</div>')+'</div>';

  h+='<div class="xsec"><div class="xsec-t">② 登録事項の変更届出（参考様式第4-4号）　<span class="sub">変更した日から14日以内</span></div>'+
    '<div class="hint">マイページで、名称・住所・代表者・事務所・支援業務の内容・相談の体制や対応言語などを変えて保存すると、自動でここに記録されます。</div>'+
    (chg.length?'<table class="tbl"><thead>'+th(['変更した日','変更した項目','届出の期限','状態','操作'])+'</thead><tbody>'+chg.map(function(l){var due=addDays(l.at,14),left=daysTo(due),st=l.filed?['提出済み','ok']:left<0?['期限切れ（'+(-left)+'日）','bad']:left<=5?['あと'+left+'日','warn']:['あと'+left+'日','info'];
      return '<tr><td class="num">'+esc(ymdj(l.at))+'<div class="sub">'+esc(l.by||'')+'</div></td><td style="font-size:12px">'+(l.items||[]).map(function(x){return '<b>'+esc(x.l)+'</b>';}).join('、')+'</td><td class="num">'+esc(ymdj(due))+'</td><td>'+pill(st[1],st[0])+(l.filed?'<div class="sub">'+esc(ymdj(l.filed))+'</div>':'')+'</td><td style="white-space:nowrap"><button class="btn btn-sm" data-tlprint="'+esc(l.id)+'">届出書を出力</button>'+(l.filed||!adm?'':' <button class="btn btn-sm btn-primary" data-tlfile="'+esc(l.id)+'">提出済みにする</button>')+'</td></tr>';}).join('')+'</tbody></table>':'<div class="empty">記録された変更はありません</div>')+'</div>';
  /* ④ 支援担当者の変更 */
  var stf=tlog().filter(function(l){return l.kind==='staff';}).slice().reverse();
  h+='<div class="xsec"><div class="xsec-t">③ 支援責任者・支援担当者の変更　<span class="sub">所属機関ごとのメイン担当・サブ担当が変わったときに記録されます。登録支援機関からの届出は不要。ただし所属機関が「支援計画の変更届出」を出します</span></div>'+
    (stf.length?'<table class="tbl"><thead>'+th(['変更した日','所属機関','内容','所属機関への連絡','操作'])+'</thead><tbody>'+stf.map(function(l){
