<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- RSO_VERSION ver.20261026.2 -->
<title>所属機関営業ボード</title>
<style>
/* 営業管理システム（営シス）と同じ見た目：左に紺のサイドバー、右に白いカード。ライトのみ */
:root{
  --text:#1a202c; --muted:#718096; --line:#e2e8f0; --line2:#edf2f7;
  --bg:#f5f7fa; --card:#ffffff; --accent:#1a365d; --accent-dk:#0f2349;
  --side:#0f2040; --side-text:#94a3b8; --side-group:#64748b;
  --ok:#38a169; --mid:#dd6b20; --low:#e53e3e;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:var(--text);font-size:14px;line-height:1.6}
button,input,select,textarea{font-family:inherit;color:var(--text)}
.num{font-variant-numeric:tabular-nums}

/* サイドバー */
.sidebar{position:fixed;left:0;top:0;bottom:0;width:220px;background:var(--side);color:#fff;padding:env(safe-area-inset-top,0px) 0 20px env(safe-area-inset-left,0px);overflow-y:auto;z-index:30}
.sb-logo{padding:20px 18px 14px;font-size:15px;font-weight:700;color:#fff}
.sb-group{padding:12px 18px 4px;font-size:10px;color:var(--side-group);font-weight:700;letter-spacing:1px}
.nav-item{display:flex;align-items:center;gap:9px;width:calc(100% - 16px);text-align:left;margin:1px 8px;padding:9px 14px;color:var(--side-text);font-size:13px;cursor:pointer;border:none;background:transparent;border-radius:6px}
.nav-item:hover{background:rgba(255,255,255,.10);color:#fff}
.nav-item.on{background:rgba(255,255,255,.14);color:#fff;font-weight:700}
.nav-item .badge{margin-left:auto;font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px;background:rgba(239,68,68,.18);color:#f87171}
.nav-item:focus-visible,.btn:focus-visible,.kpi:focus-visible{outline:2px solid #63b3ed;outline-offset:2px}

/* 本体 */
.main{padding-left:max(236px,calc(220px + 16px + env(safe-area-inset-left,0px)));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 60px}
.page-header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px;flex-wrap:wrap;gap:12px}
.page-title{margin:0 0 2px;font-size:22px;color:var(--accent);font-weight:700}
.page-subtitle{color:var(--muted);font-size:12px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
@media (max-width:820px){
  .sidebar{position:static;width:auto;padding:env(safe-area-inset-top,0px) max(8px,env(safe-area-inset-right,0px)) 8px max(8px,env(safe-area-inset-left,0px));display:flex;flex-wrap:wrap;align-items:center;gap:2px}
  .sb-logo{width:100%;padding:12px 10px 6px}
  .sb-group{display:none}
  .nav-item{width:auto;margin:0;padding:7px 11px}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-block:18px 48px}
}

.btn{padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--line2)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:var(--accent-dk)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-danger{color:#c53030}
.btn:disabled{opacity:.5;cursor:default}

/* ステータスのカード（営シスと同じ） */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:#fff;border:0;border-radius:10px;padding:12px 14px;box-shadow:0 2px 6px rgba(0,0,0,.04);border-left:4px solid #cbd5e0;cursor:pointer;text-align:left}
.kpi:hover{background:#f7fafc}
.kpi.on{outline:2px solid var(--accent)}
.kpi .k{font-size:11px;color:var(--muted)}
.kpi .v{font-size:20px;font-weight:700;line-height:1.2}

/* 期日アラート（案シスの期限アラートと同じ配色） */
.alertbar{display:flex;align-items:center;gap:10px;background:#fff5f5;border:1px solid #feb2b2;border-radius:10px;padding:11px 15px;margin-bottom:14px;cursor:pointer;width:100%;text-align:left}
.alertbar.active{background:#fed7d7;border-color:#fc8181}
.alertbar .ttl{font-size:13px;font-weight:800;color:#9b2c2c}
.alertbar .cnt{background:#dc2626;color:#fff;border-radius:9px;padding:1px 9px;font-size:12px;font-weight:800}
.alertbar .hint{font-size:11px;color:#c05621;margin-left:auto}

.filters{background:#fff;border-radius:10px;padding:14px 16px;margin-bottom:14px;box-shadow:0 2px 6px rgba(0,0,0,.04);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filters input[type=text],.filters select{padding:7px 10px;border:1px solid var(--line);border-radius:7px;font-size:13px;background:#fff}
.filters input[type=text]{min-width:0;width:260px;max-width:100%}

/* 表 */
.tablewrap{background:#fff;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.04);overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{background:#f7fafc;color:var(--muted);font-weight:600;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:#f7fafc}
tr.row-over{background:#fff5f5} tr.row-soon{background:#fffaf0}
tr.row-over:hover,tr.row-soon:hover{background:#fde8e8}
td.r,th.r{text-align:right}
.nm{font-weight:600}
.sub{color:var(--muted);font-size:11px}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
.b-未接触{background:#edf2f7;color:#4a5568}
.b-接触済み{background:#ebf8ff;color:#2b6cb0}
.b-アポ獲得{background:#e6fffa;color:#285e61}
.b-ヒアリング済み{background:#faf5ff;color:#6b46c1}
.b-提案中{background:#fffaf0;color:#c05621}
.b-受注{background:#f0fff4;color:#276749}
.b-失注{background:#fff5f5;color:#c53030}
.b-保留{background:#f7fafc;color:#a0aec0}
.kpi.s-未接触{border-left-color:#a0aec0}.kpi.s-接触済み{border-left-color:#3182ce}.kpi.s-アポ獲得{border-left-color:#319795}.kpi.s-ヒアリング済み{border-left-color:#805ad5}.kpi.s-提案中{border-left-color:#dd6b20}.kpi.s-受注{border-left-color:#38a169}.kpi.s-失注{border-left-color:#e53e3e}.kpi.s-保留{border-left-color:#cbd5e0}.kpi.s-open{border-left-color:var(--accent)}
.rank{font-weight:700}
.na-kind{display:inline-block;font-size:10px;color:#4a5568;background:#edf2f7;border-radius:4px;padding:1px 5px;margin-right:4px}
.nabadge{display:inline-block;padding:1px 7px;border-radius:999px;font-size:10px;font-weight:800;margin-left:4px}
.na-over{background:#dc2626;color:#fff} .na-soon{background:#f6ad55;color:#7b341e}
.empty{padding:40px;text-align:center;color:var(--muted)}

/* KPI画面 */
.subtabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.subtabs select{padding:6px 12px;border:1px solid var(--line);border-radius:999px;font-size:13px;font-weight:600;background:#fff;color:var(--text)}
.kcard{background:#fff;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.04);padding:16px 18px;margin-bottom:14px;min-width:0}
.kcard h3{margin:0 0 12px;font-size:14px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.goals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:14px}
@media (max-width:900px){.goals{grid-template-columns:1fr}}
.goals .kcard{margin-bottom:0}
.goalbig{text-align:center;padding:8px 0 4px}
.goalbig .num{font-size:44px;font-weight:800;line-height:1}
.goalbig .num small{font-size:20px;color:var(--muted);font-weight:700}
.goalbig .lab{font-size:13px;color:var(--muted);margin-top:6px}
.goalbig .sub{margin-top:4px}
.prow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f0f2f5}
.prow:last-child{border-bottom:none}
.prow .pname{flex:0 0 150px;font-size:13px;font-weight:600}
.prow .pname .sub{display:block;font-weight:400}
.prow .pbarwrap{flex:1;height:16px;background:var(--line2);border-radius:999px;overflow:hidden;position:relative;min-width:60px}
.prow .pbar{height:100%;border-radius:999px}
.prow .pace{position:absolute;top:0;bottom:0;width:2px;background:var(--text);opacity:.45}
.prow .pnum{flex:0 0 110px;text-align:right;font-size:13px}
.prow .pnum input{width:70px;padding:3px 6px;border:1px solid var(--line);border-radius:6px;text-align:right}
@media (max-width:600px){.prow .pname{flex-basis:92px}.prow .pnum{flex-basis:90px}}
.bar-ok{background:var(--ok)}.bar-mid{background:var(--mid)}.bar-low{background:var(--low)}.bar-none{background:#a0aec0}
.legend{font-size:11px;color:var(--muted);font-weight:400;display:flex;gap:12px;align-items:center}
.legend i{display:inline-block;width:2px;height:11px;background:var(--text);opacity:.45;margin-right:4px;vertical-align:-1px}
.two{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px}
@media (max-width:1000px){.two{grid-template-columns:1fr}}
.two .kcard{margin-bottom:14px}
.funnel{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end;gap:8px}
.fstep{display:flex;flex-direction:column;gap:4px;align-items:stretch;text-align:center}
.fstep .n{font-size:20px;font-weight:800}
.fstep .col{background:#bee3f8;border-radius:6px 6px 0 0;min-height:4px}
.fstep .l{font-size:12px;color:var(--muted);font-weight:600}
.frates{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:6px;padding-top:6px;border-top:1px solid var(--line);text-align:center;font-size:12px;color:var(--muted)}
.frates b{color:var(--text)}

/* ドロワー（営シスと同じ） */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50}
.drawer{position:fixed;top:0;right:0;bottom:0;width:60vw;min-width:min(560px,100vw);max-width:100%;background:#fff;z-index:51;overflow-y:auto;box-shadow:-4px 0 20px rgba(0,0,0,.12);padding-bottom:env(safe-area-inset-bottom,0px)}
.dhead{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:calc(16px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) 14px 20px;z-index:2;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dtitle{font-size:17px;font-weight:700;margin:0 0 3px}
.dbody{padding:4px max(20px,env(safe-area-inset-right,0px)) 30px 20px}
.dfoot{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px max(20px,env(safe-area-inset-right,0px)) 10px 20px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.sec-title{font-size:16px;font-weight:700;color:var(--accent);margin:16px 0 8px;padding-bottom:5px;border-bottom:2px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec-title .sub{font-weight:600}
.form{display:grid;grid-template-columns:110px minmax(0,1fr) 110px minmax(0,1fr);gap:8px 14px;align-items:center;font-size:13px}
.form > label{color:var(--muted);font-size:12px}
.form .span3{grid-column:2 / -1}
.form input,.form select,.form textarea{width:100%;padding:6px 9px;border:1px solid var(--line);border-radius:7px;font-size:13px;background:#fff;min-width:0}
.form textarea{min-height:64px;resize:vertical}
@media (max-width:640px){.form{grid-template-columns:96px minmax(0,1fr)}.form .span3{grid-column:2}}
.hint{font-size:11px;color:var(--muted);margin:6px 0 0}
.sugg{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.sugg li{display:flex;gap:8px;align-items:baseline;font-size:13px}
.t-bad{background:#fff5f5;color:#c53030;border:1px solid #feb2b2}
.t-warn{background:#fffaf0;color:#c05621;border:1px solid #fbd38d}
.t-ok{background:#ebf8ff;color:#2b6cb0;border:1px solid #bee3f8}
.tag{display:inline-block;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:700;white-space:nowrap}
details.hg{border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:#fff}
details.hg summary{cursor:pointer;padding:9px 12px;font-weight:700;font-size:13px;display:flex;justify-content:space-between;gap:8px;list-style:none}
details.hg summary::-webkit-details-marker{display:none}
details.hg summary::after{content:"▾";color:var(--muted)}
details.hg[open] summary{border-bottom:1px solid var(--line2)}
details.hg .body{padding:10px 12px}
details.hg .form{grid-template-columns:200px minmax(0,1fr)}
@media (max-width:640px){details.hg .form{grid-template-columns:1fr}}
.why{font-size:11px;color:#a0aec0;display:block;font-weight:400}
.note{border-left:3px solid #cbd5e0;background:#f7fafc;border-radius:0 8px 8px 0;padding:9px 12px;margin-bottom:8px}
.note .meta{font-size:11px;color:var(--muted);margin-bottom:3px}
.note .body{font-size:13px;white-space:pre-wrap}
.msg{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:12px;background:#fffaf0;color:#c05621;border:1px solid #fbd38d}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:#2d3748;color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;z-index:60}

/* ヒアリング項目 */
.hcols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:1000px){.hcols{grid-template-columns:1fr}}
.hcols .kcard{margin-bottom:0}
.hcols ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:7px;font-size:13px}
.hcols .why{font-size:12px;color:var(--muted)}
.opt{font-size:11px;color:#a0aec0}
/* AI一括登録 */
.ai-text{width:100%;min-height:180px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit;resize:vertical}
.ai-sum{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 8px;font-size:13px}
.ai-tbl{font-size:12px}
.ai-tbl td{padding:5px 6px;vertical-align:middle}
.ai-tbl input[type=text],.ai-tbl input[type=number],.ai-tbl select{width:100%;min-width:90px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;font-size:12px;background:#fff}
.ai-tbl tr.dup td{background:#fffaf0}
.ai-busy{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;padding:14px 0}
.ai-busy i{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;display:inline-block}
@media (prefers-reduced-motion:no-preference){.ai-busy i{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .2s ease-out}@keyframes slide{from{transform:translateX(30px)}}}
.login{max-width:360px;margin:80px auto;background:#fff;border-radius:12px;padding:28px;box-shadow:0 4px 16px rgba(0,0,0,.06)}
.login h2{margin:0 0 4px;font-size:18px;color:var(--accent)}
.login p{margin:0 0 18px;font-size:12px;color:var(--muted)}
.login input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;margin-bottom:10px;font-size:14px}
.ver{font-size:9px;color:var(--muted);letter-spacing:.03em}
.sb-user{padding:14px 18px 0;font-size:11px;color:var(--side-group);word-break:break-all}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body>
<div id="loginView" hidden>
  <div class="login">
    <h2>所属機関営業ボード</h2>
    <p>登録したメールアドレスとパスワードでログインしてください。</p>
    <div id="loginMsg" class="msg" hidden></div>
    <input type="email" id="liEmail" placeholder="メールアドレス" autocomplete="username">
    <input type="password" id="liPass" placeholder="パスワード" autocomplete="current-password">
    <button class="btn btn-primary" style="width:100%" id="liBtn">ログイン</button>
  </div>
</div>
<div id="appView" hidden>

<nav class="sidebar" aria-label="メニュー">
  <div class="sb-logo">所属機関営業ボード</div>
  <div class="sb-group">メニュー</div>
  <button class="nav-item" id="nav-kpi" data-v="kpi">KPI</button>
  <button class="nav-item" id="nav-leads" data-v="leads">見込み客</button>
  <button class="nav-item" id="nav-hearing" data-v="hearing">ヒアリング項目</button>
  <div class="sb-group">操作</div>
  <button class="nav-item" id="navNew">＋ 新規登録</button>
  <button class="nav-item" id="navAi">AIで一括登録</button>
  <div class="sb-group">リマインド</div>
  <button class="nav-item" id="navDue">期日切れ・今日 <span class="badge" id="navDueN">0</span></button>
  <div class="sb-group">アカウント</div>
  <button class="nav-item" id="navOut">ログアウト</button>
  <div class="sb-user" id="sbUser"></div>
</nav>

<div class="main">
  <div class="page-header">
    <div>
      <h1 class="page-title" id="pTitle">KPI</h1>
      <div class="page-subtitle" id="pSub"></div>
      <div class="ver">ver.20261026.2</div>
    </div>
    <div class="toolbar" id="pTools"></div>
  </div>
  <div id="dbNotice" class="msg" hidden></div>

  <!-- KPI -->
  <section id="v-kpi">
    <div class="subtabs">
      <select id="kMonth" aria-label="対象月"></select>
      <select id="kStaff" aria-label="担当"></select>
    </div>
    <div class="goals" id="kHead"></div>
    <div class="kcard">
      <h3><span>今月の計画と実績</span><span class="legend"><span><i></i>今日時点のペース</span><span id="kEditWrap"><button class="btn btn-sm" id="kEditBtn">目標を編集</button></span></span></h3>
      <div id="kRows"></div>
      <div id="kEditFoot" hidden style="display:flex;justify-content:flex-end;gap:8px;margin-top:10px">
        <button class="btn btn-sm" id="kCancel">やめる</button>
        <button class="btn btn-sm btn-primary" id="kSave">目標を保存</button>
      </div>
    </div>
    <div class="two">
      <div class="kcard">
        <h3>今月の歩留まり</h3>
        <div id="kFunnel"></div>
        <div class="hint">その月に記録した活動の結果で数えます。率は1つ前の段階からの割合です。</div>
      </div>
      <div class="kcard">
        <h3>獲得経路別（今月）</h3>
        <div style="overflow-x:auto"><table><thead><tr><th>経路</th><th class="r">新規登録</th><th class="r">ヒアリング</th><th class="r">受注</th></tr></thead><tbody id="kSrc"></tbody></table></div>
      </div>
    </div>
    <div class="kcard">
      <h3><span>今日やること</span><span class="sub" id="kTodoCount"></span></h3>
      <div style="overflow-x:auto"><table><thead><tr><th>期日</th><th>会社名</th><th>次の一手</th><th>段階</th><th>担当</th></tr></thead><tbody id="kTodo"></tbody></table></div>
    </div>
  </section>

  <!-- 見込み客 -->
  <section id="v-leads" hidden>
    <div class="kpis" id="stageCards"></div>
    <button class="alertbar" id="alertbar" hidden><span class="ttl">次の一手の期日が来ています</span><span class="cnt" id="alertN">0</span><span class="hint" id="alertHint">押すと期日が来ているものだけ表示</span></button>
    <div class="filters">
      <input type="text" id="lq" placeholder="会社名・分野・地域・担当で検索" aria-label="検索">
      <select id="lStaff" aria-label="担当"></select>
      <select id="lRank" aria-label="ランク"><option value="">全ランク</option><option value="A">ランクA</option><option value="B">ランクB</option><option value="C">ランクC</option></select>
      <select id="lSource" aria-label="獲得経路"></select>
      <select id="lSort" aria-label="並び順"><option value="next">次の一手が近い順</option><option value="rank">ランク順</option><option value="new">登録日が新しい順</option></select>
    </div>
    <div class="tablewrap">
      <table>

function monthActs(m,staff){return acts.filter(function(a){return a.date&&a.date.slice(0,7)===m&&(!staff||a.staff===staff);});}
function calc(m,staff){
  var r={calls:0,contacts:0,appts:0,hearings:0,proposals:0,wins:0,people:0,fee:0};
  monthActs(m,staff).forEach(function(a){
    if(a.kind==='架電')r.calls++;
    if(a.result&&a.result!=='不通')r.contacts++;
    if(a.result==='アポ獲得')r.appts++;
    if(a.result==='ヒアリング実施')r.hearings++;
    if(a.result==='提案')r.proposals++;
    if(a.result==='受注'){r.wins++;r.people+=Number(a.people||0);r.fee+=Number(a.people||0)*Number(a.fee||0);}
  });
  return r;
}
function tgt(k){var t=targets[kMonth]||targets['default']||{};var v=t[k];if(v==null){for(var i=0;i<KPIS.length;i++)if(KPIS[i].k===k)return KPIS[i].def;}return Number(v);}
function pace(m){var now=new Date(),cur=ym(now);var y=Number(m.slice(0,4)),mo=Number(m.slice(5,7));var days=new Date(y,mo,0).getDate();if(m<cur)return 1;if(m>cur)return 0;return now.getDate()/days;}

    '<div class="kcard"><div class="goalbig"><div class="num num" style="color:'+colorOf(r.people,pT,p)+'">'+r.people+' <small>/ '+pT+' 人</small></div><div class="lab">受注した支援人数</div><div class="sub">'+(r.fee?'月額委託費 '+fmt(r.fee)+'円 増':'受注時に1人あたり月額を入れると集計')+'</div></div></div>'+
    '<div class="kcard"><div class="goalbig"><div class="num num">'+(r.hearings?Math.round(r.wins/r.hearings*100):0)+'<small> %</small></div><div class="lab">ヒアリングから受注まで</div><div class="sub">ヒアリング '+r.hearings+'件 → 受注 '+r.wins+'社</div></div></div>';
  $('kRows').innerHTML=KPIS.map(function(K){
    var v=r[K.k], t=tgt(K.k), w=t?Math.min(100,v/t*100):0;

/* ---------- 次の一手の候補 ---------- */
function suggestions(L){
  var h=L.hearing||{}, out=[], t=today(), filled=hFilled(L);
  if(isOpen(L)){if(!L.nextDate)out.push(['bad','次の一手の期日が決まっていません']);else if(L.nextDate<t)out.push(['bad','期日（'+md(L.nextDate)+'）を過ぎています']);}
  if(filled===0)out.push(['warn','ヒアリング前：人手不足の状況と外国人雇用の経験から聞く']);
  if(h.h_when==='3か月以内')out.push(['warn','急ぎの採用：国内在住の候補者と、受入れまでの期間を先に示す']);
  if(h.h_exp==='なし')out.push(['ok','初めての受入れ：制度の流れ・費用の総額・期間を1枚で説明する']);
  if(h.h_sup==='他社に委託'){out.push(['ok','乗り換えの提案：今の委託費との比較と、困りごとへの対応を用意する']);if(h.h_renew)out.push(['ok','委託契約の更新時期（'+h.h_renew+'）の2か月前にもう一度連絡する']);}
  if(h.h_sup==='自社支援')out.push(['ok','自社支援の負担（定期面談・届出・記録簿）を聞き、一部だけの委託も提案する']);
  if(h.h_kyo==='未加入')out.push(['warn','分野別協議会に未加入：加入の手順を案内する']);
  if(h.h_sha==='一部未加入'||h.h_ihan==='あり')out.push(['bad','受入れの要件に不安がある：受入れ可能か行政書士に事前に確認する']);
  if(h.h_pay==='難しい')out.push(['bad','報酬は日本人と同等以上が要件：給与水準を一緒に確認する']);
  if(h.h_house==='未定')out.push(['ok','住居が未定：住居探しの支援メニューを示す']);
  if(h.h_emp==='派遣'&&h.h_field!=='農業'&&h.h_field!=='漁業'&&L.field!=='農業'&&L.field!=='漁業')out.push(['bad','派遣で受け入れられるのは農業・漁業だけ：直接雇用にできるか確認する']);
  if(h.h_ins==='国保')out.push(['warn','国保の場合：法人なら社会保険の加入が必要。個人事業所かどうかを確認する']);
  if(h.h_move)out.push(['ok','技能実習からの移行予定あり：対象者の在留期限の一覧をもらう']);
  if(h.h_cmp)out.push(['ok','比較先（'+h.h_cmp+'）との違いを1枚にまとめて持っていく']);
  if(filled>0&&!h.h_dec)out.push(['warn','決裁者がまだ分からない：次回は決裁者の同席をお願いする']);
  return {list:out,filled:filled};
}

/* ---------- AIで一括登録 ----------
   テキストを Edge Function「ai-import」に送り、AIが読み取った会社を確認画面に並べる。
   登録はこの画面で選んだ行だけ（AIは読み取るだけで、DBには書かない） */
var aiOpen=false, aiText='', aiRows=[], aiBusy=false, aiNote='', aiErr='';
var aiCommon={staff:'',source:'テレアポ',rank:'C',stage:'未接触',nextDate:'',nextKind:'電話'};
function normName(s){return String(s||'').normalize('NFKC').replace(/株式会社|有限会社|合同会社|一般社団法人|社会福祉法人|医療法人|協同組合|\(株\)|\(有\)|（株）|（有）|\s/g,'').toLowerCase();}
function telDigits(s){var d=String(s||'').replace(/[^0-9]/g,'');return d.length>=10?d.slice(0,11):'';}
function markDups(){
  var names={}, tels={};
  leads.forEach(function(l){var n=normName(l.name);if(n)names[n]=l.name;var t=telDigits(l.tel);if(t)tels[t]=l.name;});
  var seen={};
  aiRows.forEach(function(r){
    var n=normName(r.name), t=telDigits(r.tel); r.dup='';
    if(n&&names[n])r.dup='登録済み：'+names[n]; else if(t&&tels[t])r.dup='電話が同じ：'+tels[t]; else if(n&&seen[n])r.dup='この中で重複';
    if(n)seen[n]=1;
  });
}
function openAiImport(){
  aiOpen=true; openId=null; draft=null; aiErr='';
  renderAi(); $('drawer').hidden=false; $('overlay').hidden=false;
  setTimeout(function(){var t=$('ai_text');if(t&&!aiRows.length)t.focus();},30);
}
function renderAi(){
  var sel=aiRows.filter(function(r){return r.sel;}).length, dups=aiRows.filter(function(r){return r.dup;}).length;
  var html='<div class="dhead"><div><div class="dtitle" id="dTitle">AIで一括登録</div><div class="sub">リストや名刺・メールの文章を貼り付けると、AIが会社ごとに読み取ります。登録は確認してから行います。</div></div><button class="btn btn-sm" id="aiClose">閉じる</button></div><div class="dbody">'+
  '<div class="sec-title">1. テキストを貼り付け</div>'+
  '<textarea class="ai-text" id="ai_text" placeholder="例：Excelの表をそのままコピー、テレアポのリスト、名刺の文字、問い合わせメールの本文など">'+esc(aiText)+'</textarea>'+
  '<div class="hint">一度に40,000文字まで。会社名・住所・電話・業種などが書いてあれば、列の並びや書き方はそろっていなくてかまいません。</div>'+
  '<div class="sec-title">2. まとめて入れる値</div><div class="form">'+
    '<label for="ai_staff">担当</label><input type="text" id="ai_staff" list="aiStaffDl" value="'+esc(aiCommon.staff)+'"><datalist id="aiStaffDl">'+staffList().map(function(s){return '<option value="'+esc(s)+'">';}).join('')+'</datalist>'+
    '<label for="ai_source">獲得経路</label><select id="ai_source">'+opts(SOURCES,aiCommon.source)+'</select>'+
    '<label for="ai_rank">ランク</label><select id="ai_rank">'+opts(['A','B','C'],aiCommon.rank)+'</select>'+
    '<label for="ai_stage">ステータス</label><select id="ai_stage">'+opts(STAGES,aiCommon.stage)+'</select>'+
    '<label for="ai_nextDate">次の一手の期日</label><input type="date" id="ai_nextDate" value="'+esc(aiCommon.nextDate)+'">'+
    '<label for="ai_nextKind">方法</label><select id="ai_nextKind">'+opts(NEXT_KINDS,aiCommon.nextKind)+'</select>'+
  '</div>'+
  '<div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="btn btn-primary" id="aiRun"'+(aiBusy?' disabled':'')+'>'+(aiRows.length?'もう一度読み取る':'AIで読み取る')+'</button></div>'+
  (aiBusy?'<div class="ai-busy"><i></i>AIが読み取っています。量が多いと1分ほどかかります。</div>':'')+
  (aiErr?'<div class="msg" style="margin-top:10px">'+esc(aiErr)+'</div>':'')+
  (aiRows.length?
   '<div class="sec-title">3. 確認して登録<span class="sub num">'+aiRows.length+'社'+(dups?'（重複の疑い '+dups+'社）':'')+'</span></div>'+
   (aiNote?'<div class="hint" style="margin:0 0 6px">AIからのメモ：'+esc(aiNote)+'</div>':'')+
   '<div class="ai-sum"><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="ai_all"'+(sel===aiRows.length?' checked':'')+'> すべて選ぶ</label><span class="sub">重複の疑いがある行は最初から外してあります。内容は直接直せます。</span></div>'+
   '<div class="tablewrap"><table class="ai-tbl"><thead><tr><th></th><th>会社名</th><th>所在地</th><th>分野</th><th>電話・メール</th><th>先方担当者</th><th>想定人数</th><th>メモ</th></tr></thead><tbody>'+
   aiRows.map(function(r,i){return '<tr class="'+(r.dup?'dup':'')+'"><td><input type="checkbox" data-sel="'+i+'"'+(r.sel?' checked':'')+' aria-label="登録する"></td>'+
     '<td><input type="text" data-i="'+i+'" data-k="name" value="'+esc(r.name)+'">'+(r.dup?'<div class="sub" style="color:#c05621">'+esc(r.dup)+'</div>':'')+'</td>'+
     '<td><input type="text" data-i="'+i+'" data-k="pref" value="'+esc(r.pref)+'"></td>'+
     '<td><select data-i="'+i+'" data-k="field">'+opts(FIELDS,r.field,'選択')+'</select></td>'+
     '<td><input type="text" data-i="'+i+'" data-k="tel" value="'+esc(r.tel)+'"></td>'+
     '<td><input type="text" data-i="'+i+'" data-k="contact" value="'+esc(r.contact)+'"></td>'+
     '<td><input type="number" min="0" data-i="'+i+'" data-k="people" value="'+esc(r.people)+'" style="min-width:60px"></td>'+
     '<td><input type="text" data-i="'+i+'" data-k="memo" value="'+esc(r.memo)+'" style="min-width:160px"></td></tr>';}).join('')+
   '</tbody></table></div>':'')+
  '</div><div class="dfoot"><span class="sub" id="aiSelN">'+(aiRows.length?'選択中 '+sel+'社':'')+'</span><div style="display:flex;gap:8px"><button class="btn" id="aiCancel">閉じる</button>'+(aiRows.length?'<button class="btn btn-primary" id="aiSave"'+(sel&&!aiBusy?'':' disabled')+'>選んだ'+sel+'社を登録する</button>':'')+'</div></div>';
  var dr=$('drawer'), top=dr.scrollTop; dr.innerHTML=html; dr.scrollTop=top;
  $('aiClose').onclick=closeDrawer; $('aiCancel').onclick=closeDrawer; $('aiRun').onclick=runAi;
  $('ai_text').addEventListener('input',function(e){aiText=e.target.value;});
  ['staff','source','rank','stage','nextDate','nextKind'].forEach(function(k){var el=$('ai_'+k);el.addEventListener('change',function(){aiCommon[k]=el.value.trim();});el.addEventListener('input',function(){aiCommon[k]=el.value.trim();});});
  dr.querySelectorAll('[data-i]').forEach(function(el){el.addEventListener('input',function(){aiRows[+el.dataset.i][el.dataset.k]=el.value;});el.addEventListener('change',function(){aiRows[+el.dataset.i][el.dataset.k]=el.value;});});
  dr.querySelectorAll('[data-sel]').forEach(function(el){el.addEventListener('change',function(){aiRows[+el.dataset.sel].sel=el.checked;aiSelUpdate();});});
  if($('ai_all'))$('ai_all').addEventListener('change',function(e){aiRows.forEach(function(r){r.sel=e.target.checked;});dr.querySelectorAll('[data-sel]').forEach(function(c){c.checked=e.target.checked;});aiSelUpdate();});
  if($('aiSave'))$('aiSave').onclick=saveAi;
}
function aiSelUpdate(){var n=aiRows.filter(function(r){return r.sel;}).length;$('aiSelN').textContent='選択中 '+n+'社';var b=$('aiSave');if(b){b.textContent='選んだ'+n+'社を登録する';b.disabled=!n;}}
async function aiErrorText(err){
  try{var c=err&&err.context;if(c&&typeof c.json==='function'){var j=await c.json();if(j&&j.message)return j.message;}}catch(e){}
  return 'AIの読み取りに失敗しました：'+(err&&err.message||'不明なエラー');
}
async function runAi(){
  aiText=$('ai_text').value; if(!aiText.trim()){toast('テキストを貼り付けてください');return;}
  aiBusy=true; aiErr=''; renderAi();
  try{
    var r=await db.functions.invoke('ai-import',{body:{text:aiText}});
    if(r.error)throw r.error;
    var d=r.data||{}; if(!d.ok)throw new Error(d.message||'読み取りに失敗しました');
    aiNote=(d.note||'')+(d.truncated?'（量が多く、途中までしか読み取れていない可能性があります。分けて貼り付けてください）':'');
    aiRows=(d.leads||[]).filter(function(x){return x&&x.name;}).map(function(x){return {name:x.name||'',pref:x.pref||'',field:FIELDS.indexOf(x.field)>=0?x.field:'その他・未定',contact:x.contact||'',tel:x.tel||'',people:x.people==null?'':x.people,memo:x.memo||'',sel:true,dup:''};});
    markDups(); aiRows.forEach(function(r){if(r.dup)r.sel=false;});
    if(!aiRows.length)aiErr='会社を読み取れませんでした。会社名が含まれているか確認してください。';
  }catch(e){aiErr=await aiErrorText(e);}
  aiBusy=false; if(aiOpen)renderAi();
}
async function saveAi(){
  var rows=aiRows.filter(function(r){return r.sel&&String(r.name).trim();});
  if(!rows.length)return;
  var c=aiCommon, now=new Date().toISOString();
  var body=rows.map(function(r){var h={};if(r.field&&r.field!=='その他・未定')h.h_field=r.field;return {name:String(r.name).trim(),pref:r.pref,field:r.field,source:c.source,contact:r.contact,tel:r.tel,stage:c.stage||'未接触',rank:c.rank,staff:c.staff,people:n2(r.people),fee:null,next_date:c.nextDate||null,next_kind:c.nextKind,next_note:'',plan:'',memo:r.memo,hearing:h,updated_at:now};});
  var b=$('aiSave'); b.disabled=true; b.textContent='登録しています…';
  try{
    for(var i=0;i<body.length;i+=200)must(await db.from('leads').insert(body.slice(i,i+200)));
    toast(body.length+'社を登録しました');
    aiRows=[]; aiText=''; aiNote=''; closeDrawer(); lStage='all'; lDueOnly=false; lSort='new'; if($('lSort'))$('lSort').value='new'; setView('leads'); await loadAll();
  }catch(e){toast('登録できませんでした：'+(e&&e.message||''));b.disabled=false;aiSelUpdate();}
}

/* ---------- ヒアリング項目 ---------- */
function renderHearing(){
  $('hList').innerHTML=HEARING.map(function(g,gi){return '<div class="kcard"><h3>'+(gi+1)+'. '+esc(g.g)+'</h3><ol>'+g.items.map(function(it){return '<li><b>'+esc(it.l)+'</b>'+(it.t==='sel'?' <span class="opt">（'+esc(it.o.length>6?'分野の一覧から選択':it.o.join('／'))+'、または直接記入）</span>':'')+'<span class="why">'+esc(it.why)+'</span></li>';}).join('')+'</ol></div>';}).join('');
}

/* ---------- 描画 ---------- */
function render(){
  $('navDueN').textContent=leads.filter(isDue).length;
  if(view==='kpi')renderKpi(); else if(view==='leads')renderLeads(); else renderHearing();
}

/* ---------- 起動 ---------- */
try{var sv=localStorage.getItem('eb_view');if(sv&&TITLES[sv])view=sv;}catch(e){}
setView(view);
async function boot(){
  if(!window.supabase||SUPABASE_URL.indexOf('YOUR-')>=0){
    $('loginView').hidden=false; var m=$('loginMsg'); m.hidden=false;
    m.textContent=!window.supabase?'接続用のライブラリを読み込めませんでした。通信環境を確認して再読み込みしてください。':'Supabase の接続先がまだ設定されていません（SUPABASE_URL と SUPABASE_KEY）。';
    return;
  }
  db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  var ses=(await db.auth.getSession()).data.session;
  if(ses)startApp(ses); else $('loginView').hidden=false;
}
async function startApp(ses){
  $('loginView').hidden=true; $('appView').hidden=false;
  $('sbUser').textContent=ses&&ses.user?ses.user.email:'';
  try{await loadAll();}catch(e){var n=$('dbNotice');n.hidden=false;n.textContent='データを読み込めませんでした：'+(e&&e.message||'');}
  if(!startApp._t)startApp._t=setInterval(function(){if(document.visibilityState==='visible'&&$('drawer').hidden)loadAll().catch(function(){});},60000);
}
$('liBtn').addEventListener('click',async function(){
  var m=$('loginMsg'); if(!db)return; m.hidden=true;
  var r=await db.auth.signInWithPassword({email:$('liEmail').value.trim(),password:$('liPass').value});
  if(r.error){m.hidden=false;m.textContent='ログインできませんでした。メールアドレスとパスワードを確認してください。';return;}
  startApp(r.data.session);
});
$('liPass').addEventListener('keydown',function(e){if(e.key==='Enter')$('liBtn').click();});
$('navOut').addEventListener('click',async function(){await db.auth.signOut();location.reload();});
boot();
})();
</script>
